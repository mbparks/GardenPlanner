<!DOCTYPE html>
<!-- Garden Planner :: garden-planner.html :: v2.6.0 -->
<html lang="en" data-theme="garden">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden Planner :: Zone 7a Square Foot Method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap">
<style>
/* Garden Planner v2.6.0. Fonts are additive only: the local stacks below carry the
   design if the remote sheet never loads (offline, file:// use). */
:root{
  --font-display:"Lora","Iowan Old Style",Georgia,"Times New Roman",serif;
  --font-body:"DM Sans","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  --cell:clamp(28px,4.4vw,38px);
  --radius:10px;
  --shadow:0 1px 4px rgba(0,0,0,.08);
  --tap:44px;
}
:root[data-theme="garden"]{
  --bg:#f4f0e8; --panel:#fffdf6; --panel-2:#f8f5ee; --soil:#ede9df;
  --ink:#2d2a22; --muted:#665c4a; --line:#c8bea8; --line-strong:#8f8469;
  --header:#2d4a2d; --header-ink:#f4f0e8; --header-dim:#a8c8a8;
  --accent:#3a5e3a; --accent-ink:#fffdf6; --accent-soft:#4a7c4a;
  --good:#1a6b3c; --good-bg:#e7f3e7; --good-line:#5a9e5a;
  --bad:#a8321f; --bad-bg:#fbeae6; --bad-line:#d07a63;
  --warn:#775a15; --warn-bg:#f7f0dc;
  --frost:#7fa8cf; --indoor:#8fbcdf; --transplant:#8fc99a; --direct:#4f9a5c; --harvest:#d9a441;
  --terracotta:#b5643c;
}
:root[data-theme="night"]{
  --bg:#14170f; --panel:#1e2318; --panel-2:#232a1c; --soil:#2a3122;
  --ink:#eae6d6; --muted:#a49c85; --line:#3d4634; --line-strong:#828d78;
  --header:#0e120b; --header-ink:#eae6d6; --header-dim:#9dc09d;
  --accent:#6fa471; --accent-ink:#0e120b; --accent-soft:#7fb681;
  --good:#8fd6a2; --good-bg:#1d3324; --good-line:#4e8a5e;
  --bad:#f0a08c; --bad-bg:#3a201a; --bad-line:#a05a45;
  --warn:#e0c070; --warn-bg:#332b16;
  --frost:#7fa8cf; --indoor:#6f9dc4; --transplant:#6fae7e; --direct:#4f9a5c; --harvest:#c8963a;
  --terracotta:#c47a52;
}
:root[data-theme="contrast"]{
  --bg:#000; --panel:#000; --panel-2:#0b0b0b; --soil:#111;
  --ink:#fff; --muted:#e0e0e0; --line:#fff; --line-strong:#fff;
  --header:#000; --header-ink:#fff; --header-dim:#ffe14d;
  --accent:#ffe14d; --accent-ink:#000; --accent-soft:#ffe14d;
  --good:#7dff9a; --good-bg:#062d12; --good-line:#7dff9a;
  --bad:#ff9d8a; --bad-bg:#3a0d05; --bad-line:#ff9d8a;
  --warn:#ffe14d; --warn-bg:#2b2408;
  --frost:#8fd2ff; --indoor:#8fd2ff; --transplant:#7dff9a; --direct:#2fdc63; --harvest:#ffe14d;
  --terracotta:#ffb38a;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:15px; line-height:1.45;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0}
a{color:var(--accent); text-decoration:underline}
:root[data-theme="night"] a,:root[data-theme="contrast"] a{color:var(--header-dim)}
button,input,select,textarea{font-family:inherit; font-size:14px; color:inherit}
:focus-visible{outline:3px solid var(--terracotta); outline-offset:2px}
:root[data-theme="contrast"] :focus-visible{outline-color:#ffe14d}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--soil)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:0;background:var(--panel);padding:10px 14px;z-index:60}
.skip:focus{left:8px;top:8px}

/* header */
.topbar{background:var(--header); color:var(--header-ink); padding:14px 20px 0; border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:10px}
.brand h1{font-size:clamp(19px,2.6vw,24px);color:var(--header-ink);letter-spacing:.01em}
.brand .sub{font-size:12px;color:var(--header-dim);letter-spacing:.08em;text-transform:uppercase}
.brand .spacer{flex:1 1 auto}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hdr-btn{background:transparent;color:var(--header-ink);border:1px solid var(--accent-soft);border-radius:8px;
  padding:8px 12px;font-size:12px;cursor:pointer;min-height:36px}
.hdr-btn:hover{background:var(--accent-soft);color:var(--accent-ink)}
.hdr-btn.solid{background:var(--accent-soft);color:var(--accent-ink)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{white-space:nowrap}
.tab-btn{background:none;border:none;cursor:pointer;font-size:13px;font-weight:500;padding:11px 16px;
  color:var(--header-dim);border-bottom:3px solid transparent;min-height:var(--tap)}
.tab-btn[aria-selected="true"]{color:var(--header-ink);border-bottom-color:var(--header-dim)}
.tab-btn:hover{color:var(--header-ink)}

main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.tab-body{margin-top:14px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;
  padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.toolbar-gap{flex:1 1 auto}
.toolbar-count{white-space:nowrap}
.disclosure{margin-top:10px}
.disclosure-toggle::after{content:"\25be";margin-left:8px;display:inline-block}
.disclosure.open .disclosure-toggle::after{transform:rotate(180deg)}
.disclosure-body{margin-top:10px;padding:12px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:var(--radius)}
.date-field{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.date-label{min-width:78px}
.palette-hint{font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.sec-title{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.lede{font-size:13px;color:var(--muted);margin:4px 0 18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input-sm{padding:8px 10px;border:1px solid var(--line-strong);border-radius:7px;background:var(--panel);outline:none;min-height:36px}
.input-sm:focus{border-color:var(--accent)}
.btn{font-size:13px;font-weight:500;padding:9px 14px;background:var(--accent);color:var(--accent-ink);
  border:1px solid var(--accent);border-radius:7px;cursor:pointer;min-height:var(--tap)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
.btn.tiny{min-height:32px;padding:5px 10px;font-size:12px}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;border:1px solid var(--line-strong);color:var(--muted)}
.note{font-size:12px;padding:7px 10px;border-radius:7px;border:1px solid}
.note.good{color:var(--good);background:var(--good-bg);border-color:var(--good-line)}
.note.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}
.note.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn)}

/* planner */
.planner{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.planner{grid-template-columns:1fr}}
.palette{position:sticky;top:10px}
@media (max-width:860px){.palette{position:static}}
.chips{display:flex;flex-direction:column;gap:4px;max-height:330px;overflow-y:auto;padding-right:2px}
.chip{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:20px;font-size:13px;
  cursor:pointer;border:2px solid transparent;background:var(--panel-2);width:100%;text-align:left;min-height:38px}
.chip .nm{flex:1}
.chip .per{font-size:10px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.chip .swatch{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);flex:none}
.filters{margin:8px 0 8px}
.filters .toggle-set{flex-wrap:wrap}
/* Any toggle in the app reads the same way when it is on: filled, not merely
   tinted, with a tick so it does not rest on colour alone. */
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn[aria-pressed="true"]:hover{background:var(--accent);filter:brightness(1.08)}
.btn[aria-pressed="true"]::before{content:"\2713";margin-right:6px;font-weight:700}
.btn.tiny[aria-pressed="true"]::before{margin-right:4px}
:root[data-theme="contrast"] .btn[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-4px}
.toggle-set{display:inline-flex;gap:0;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.toggle-set .btn{border-radius:0;border:none;border-right:1px solid var(--line-strong);min-height:38px}
.toggle-set .btn:last-child{border-right:none}
.toggle-set .btn[aria-pressed="false"]{background:var(--panel);color:var(--muted)}
.mark-sample{display:inline-flex;align-items:center;gap:6px}
.tally{display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 0}
.tally .nm{flex:1}

.plot{display:grid;gap:12px;justify-content:start;margin-bottom:16px;align-items:start}
@media (max-width:760px){.plot{grid-template-columns:1fr}}
.open-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--soil);
  border:2px dashed var(--line-strong);border-radius:var(--radius);min-height:88px;min-width:120px;padding:10px;
  cursor:pointer;color:var(--muted);font-family:inherit}
.open-cell span{font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.open-cell .plus{opacity:0;font-size:12px;letter-spacing:.04em;text-transform:none;color:var(--accent)}
.open-cell:hover,.open-cell:focus-visible{border-color:var(--accent);color:var(--ink)}
.open-cell:hover .plus,.open-cell:focus-visible .plus{opacity:1}
@media (pointer:coarse){.open-cell .plus{opacity:1}}
.open-cell.drop,.bed.drop{border-color:var(--terracotta);background:var(--warn-bg)}
.bed[draggable="true"]{cursor:grab}
.plot-controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.plot-controls .k{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bed-editor{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;margin-top:10px;
  padding:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px}
.bed-editor .k{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bed-editor .btn{justify-self:start;grid-column:2}
.dpad{display:grid;grid-template-columns:repeat(3,32px);grid-template-rows:repeat(2,32px);gap:3px;justify-content:start}
.dpad .btn:nth-child(1){grid-area:1/2}
.dpad .btn:nth-child(2){grid-area:2/1}
.dpad .btn:nth-child(3){grid-area:2/3}
.dpad .btn:nth-child(4){grid-area:2/2}
.dpad .btn{min-height:32px;padding:0}
.bed{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px;box-shadow:var(--shadow)}
.bed-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.bed-name{font-family:var(--font-display);font-size:13px;font-weight:600}
.bed-crop{font-size:11px;color:var(--muted);display:block}
.bed-count{font-size:11px;color:var(--muted);white-space:nowrap}
.grid{display:grid;gap:3px;width:max-content}
.mark{width:1em;height:1em;display:inline-block;vertical-align:-.15em;flex:none;overflow:visible}
.mark-emoji{width:auto;height:auto;line-height:1}
.mark-empty{color:var(--muted);font-size:26px;line-height:1}
.sq .mark{width:calc(var(--cell) * .68);height:calc(var(--cell) * .68)}
.sq .mark-emoji{font-size:calc(var(--cell) * .48)}
.cont-card .em{display:flex;align-items:center;justify-content:center;width:34px}
.sq{width:var(--cell);height:var(--cell);border:1px solid var(--line-strong);border-radius:5px;background:var(--panel-2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell) * .48);padding:0;
  position:relative;transition:background .1s,border-color .1s}
@media (pointer:coarse){:root{--cell:44px}}
.sq.filled{border-color:var(--line)}
/* a square another plant is spreading over: still there, just quieter */
.sq.held{border-style:dashed;cursor:pointer}
.sq.held .held-mark{width:26%;height:26%;border-radius:50%;background:currentColor;opacity:.32;
  color:var(--ink);display:block}
.sq .more-mark{position:absolute;right:2px;bottom:1px;font-size:9px;font-weight:600;color:var(--muted);
  line-height:1;pointer-events:none}
.sq.friend{background:var(--good-bg)!important;border-color:var(--good-line);box-shadow:inset 0 0 0 1px var(--good-line)}
.sq.foe{background:var(--bad-bg)!important;border-color:var(--bad-line);box-shadow:inset 0 0 0 1px var(--bad-line)}
.sq.here{outline:2px solid var(--terracotta);outline-offset:1px}
.sq .ghost{opacity:.28;font-size:calc(var(--cell) * .4)}
.bed{position:relative}
.bed-edit{position:absolute;top:8px;right:8px;min-height:28px;padding:3px 9px;font-size:11px;opacity:.45}
.bed:hover .bed-edit,.bed:focus-within .bed-edit,.bed-edit:focus-visible{opacity:1}
@media (pointer:coarse){.bed-edit{opacity:1}}
.bed-head{padding-right:52px}
.bed-flags{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.tag{font-size:10px;padding:2px 7px;border-radius:9px;border:1px solid}
.tag.good{color:var(--good);background:var(--good-bg);border-color:var(--good-line)}
.tag.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}
.border-strip{margin-bottom:16px}
.tooltip{position:fixed;z-index:80;background:var(--ink);color:var(--bg);padding:9px 12px;border-radius:8px;
  font-size:12px;max-width:230px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.3);line-height:1.35}
:root[data-theme="contrast"] .tooltip{background:#000;color:#fff;border:2px solid #fff}
.tooltip b{display:block;font-size:13px;margin-bottom:3px}
.tooltip .g{color:var(--transplant)}
.tooltip .b{color:var(--terracotta)}

/* calendar */
.cal-row{display:grid;grid-template-columns:minmax(120px,150px) minmax(0,1fr);gap:10px;align-items:center;margin-bottom:4px}
.cal-name{display:flex;align-items:center;gap:6px;font-size:12px;min-width:0}
.cal-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-track{position:relative;height:21px;background:var(--panel-2);border:1px solid var(--line-strong);border-radius:5px;overflow:hidden}
.cal-bar{position:absolute;height:5px;border-radius:3px}
.cal-months{position:absolute;inset:0;display:grid;grid-template-columns:repeat(12,1fr);pointer-events:none}
.cal-months i{border-right:1px solid var(--line);opacity:.5}
.cal-months i:last-child{border-right:none}
.cal-head{font-size:10px;text-align:center;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cal-frost{position:absolute;top:0;bottom:0;width:2px;background:var(--frost)}
.cal-frost-zone{position:absolute;top:0;bottom:0;background:var(--frost);opacity:.14}
.dim{opacity:.42}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:22px;height:6px;border-radius:3px;display:inline-block}

/* tables and lists */
.lib-row{display:grid;grid-template-columns:26px minmax(120px,1.1fr) 74px 1.2fr 1.3fr 1.3fr 84px;gap:10px;align-items:start;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px;margin-bottom:6px;font-size:11.5px}
@media (max-width:900px){.lib-row{grid-template-columns:26px 1fr;row-gap:6px}}
.lib-row .k{color:var(--muted);font-size:10px;display:block;text-transform:uppercase;letter-spacing:.06em}
.cont-card{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px;margin-bottom:8px;flex-wrap:wrap}
.cont-card .em{font-size:26px;line-height:1}
.cont-card .body{flex:1 1 180px;min-width:0}
.test-line{display:flex;gap:8px;font-size:12px;padding:3px 0;border-bottom:1px solid var(--line)}
.test-line .st{font-weight:600;width:46px;flex:none}
.test-line .st.p{color:var(--good)}
.test-line .st.f{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:90;background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:9px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:90vw}
:root[data-theme="contrast"] .toast{border:2px solid #fff}
.hidden{display:none!important}

/* season scrubber */
.season{margin-bottom:12px}
.scrub{width:100%;margin:2px 0 0;accent-color:var(--accent);height:28px;border:1px solid transparent}
.scrub-marks{display:grid;grid-template-columns:repeat(12,1fr);font-size:9px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em}
.scrub-marks span{text-align:center}
.sq.later .ghost{opacity:.55;font-size:calc(var(--cell) * .7);line-height:1;color:var(--accent)}
.sq.later{border-style:dashed}
.tally.dim{opacity:.45}
.inspector{margin-bottom:12px;border-color:var(--accent)}
.inspector .chip{width:auto}
/* journal */
.journal-row{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);
  border-radius:var(--radius);padding:12px;margin-bottom:8px}
.journal-row.outcome-good{border-left-color:var(--good-line)}
.journal-row.outcome-poor{border-left-color:var(--warn)}
.journal-row.outcome-failed{border-left-color:var(--bad-line)}
.journal-dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 10px;margin-top:8px}
textarea.input-sm{font-size:13px;line-height:1.4}
/* mobile pass */
@media (max-width:640px){
  .toolbar{padding:7px 8px;gap:6px}
  .toolbar-count{display:none}
  .bed-head{padding-right:44px}
  main{padding:12px 10px 60px}
  .topbar{padding:10px 12px 0}
  .brand h1{font-size:18px}
  .brand .sub{font-size:10px}
  .tab-btn{padding:10px 12px;font-size:12px}
  .season{position:sticky;top:0;z-index:20}
  .bed{padding:9px}
  .plot{gap:9px}
  .lib-row{font-size:12px}
}
@media print{
  .topbar,.hdr-actions,.palette,.plot-controls,.season,.bed-editor,.inspector,.btn,.open-cell{display:none!important}
  body{background:#fff;color:#000}
  .planner{display:block}
  .plot{display:block}
  .bed{break-inside:avoid;page-break-inside:avoid;margin-bottom:14px;box-shadow:none;border:1px solid #999}
  .sq{border-color:#999!important;background:#fff!important}
  .note{border:1px solid #999}
}

/* this week */
.task{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-left:4px solid var(--line-strong);border-radius:var(--radius);padding:9px 12px;margin-bottom:6px;flex-wrap:wrap}
.task.late{border-left-color:var(--bad-line)}
.task.done{opacity:.55}
.task-body{flex:1 1 160px;min-width:0}
.task-when{white-space:nowrap}
.task-kind{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  padding:3px 8px;border-radius:9px;white-space:nowrap;border:1px solid}
.tone-indoor{color:var(--ink);background:var(--indoor);border-color:var(--indoor)}
.tone-transplant{color:var(--ink);background:var(--transplant);border-color:var(--transplant)}
.tone-direct{color:var(--bg);background:var(--direct);border-color:var(--direct)}
.tone-harvest{color:var(--ink);background:var(--harvest);border-color:var(--harvest)}
.tone-muted{color:var(--muted);background:transparent;border-color:var(--line-strong)}
/* seeds */
.seed-row{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--good-line);
  border-radius:var(--radius);padding:11px;margin-bottom:7px}
.seed-row.short{border-left-color:var(--harvest)}
.seed-stock{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:7px}
/* bed by bed */
.gantt-label{justify-content:flex-start;text-align:left;font-size:11px;min-height:24px;padding:2px 6px;width:100%}
.cal-track.gantt{height:24px}
.gantt-bar{position:absolute;top:3px;bottom:3px;border-radius:4px;overflow:hidden;display:flex;align-items:center}
.gantt-bar span{font-size:9px;padding:0 4px;color:var(--bg);white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.35)}
:root[data-theme="contrast"] .gantt-bar span{color:#000;text-shadow:none}
.gantt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--terracotta)}
/* harvest load */
.load-chart{display:grid;grid-template-columns:repeat(53,1fr);align-items:end;gap:1px;height:120px;
  background:var(--panel-2);border:1px solid var(--line-strong);border-radius:8px;padding:6px 4px;position:relative}
.load-chart::before{content:"";position:absolute;left:4px;right:4px;bottom:calc(6px + var(--capacity,30%));
  border-top:1px dashed var(--muted)}
.load-col{display:flex;align-items:flex-end;height:100%}
.load-col i{display:block;width:100%;background:var(--direct);border-radius:2px 2px 0 0;min-height:1px}
.load-col.glut i{background:var(--harvest)}
.load-axis{display:grid;grid-template-columns:repeat(12,1fr);font-size:9px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.load-axis span{text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.topbar,.hdr-actions,.palette,.btn{display:none!important} body{background:#fff}}

/* ---------- small helpers ------------------------------------------------- */
function h(tag, props){
  const el = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (v === null || v === undefined) continue;
    /* ARIA state is a word, not a presence. aria-pressed="false" has to be
       written out, and a bare aria-pressed="" says nothing at all. Skipping the
       false case here is what left every toggle in the app looking unpressed,
       styling included, since the CSS matches on the word. */
    if (k.slice(0, 5) === "aria-"){ el.setAttribute(k, String(v)); continue; }
    if (v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") for (const sk in v){
      if (sk.slice(0, 2) === "--") el.style.setProperty(sk, v[sk]); else el.style[sk] = v[sk];
    }
    else if (k === "text") el.textContent = String(v);
    else if (k.slice(0,2) === "on") el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (let i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(parent, kid){
  if (kid === null || kid === undefined || kid === false) return;
  if (Array.isArray(kid)) { kid.forEach(function(k){ add(parent, k); }); return; }
  parent.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
}
/* Three places wanted a file on disk and two wanted a CSV, so they share these
   rather than each keeping their own copy of the same eight lines. */
function downloadFile(name, text, mime){
  const url = URL.createObjectURL(new Blob([text], {type:mime || "text/plain"}));
  const a = h("a", {href:url, download:name});
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function toCsv(rows){
  return rows.map(function(r){
    return r.map(function(v){
      const cell = (v === null || v === undefined) ? "" : String(v);
      return /[",\n]/.test(cell) ? '"' + cell.replace(/"/g, '""') + '"' : cell;
    }).join(",");
  }).join("\n");
}
function slug(text, fallback){
  return String(text || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || fallback;
}
/* A month and a day, used by the journal, the frost dates and anywhere else a
   date is a date rather than a timestamp. */
function dateFields(label, value, onset, opts){
  const box = h("div", {class:"date-field"});
  const o = opts || {};
  const mSel = h("select", {class:"input-sm", "aria-label":label + " month"});
  if (o.clearable) add(mSel, h("option", {value:"", selected:!value, text:"--"}));
  MONTHS.forEach(function(m, i){
    add(mSel, h("option", {value:i, selected:value !== null && value !== undefined && fromDoy(value)[0] === i, text:m}));
  });
  const dIn = h("input", {class:"input-sm", type:"number", min:"1", max:"31", style:{width:"66px"},
    value:(value === null || value === undefined) ? "" : fromDoy(value)[1], "aria-label":label + " day"});
  const push = function(){
    if (o.clearable && mSel.value === ""){ onset(null); return; }
    const m = Number(mSel.value) || 0;
    const d = Math.max(1, Math.min(31, Number(dIn.value) || 1));
    onset(doy([m, d]));
  };
  mSel.addEventListener("change", push);
  dIn.addEventListener("change", push);
  if (label) add(box, h("span", {class:"per date-label", text:label}));
  add(box, mSel);
  add(box, dIn);
  box.read = function(){ return doy([Number(mSel.value) || 0, Math.max(1, Math.min(31, Number(dIn.value) || 1))]); };
  return box;
}

function svgEl(tag, attrs, kids){

  (kids || []).forEach(function(spec){ el.appendChild(svgEl(spec[0], spec[1], spec[2])); });

/* One mark per plant: a drawn form tinted with the plant's own colour, or the
   emoji if the grower prefers them. */
function glyph(plant, size){
  if (!plant) return document.createTextNode("");
  const form = GLYPH_FORMS[GLYPH_OF[plant.id]];
  if (state.ui.emojiMarks || !form){
    const span = document.createElement("span");
    span.className = "mark mark-emoji";
    span.textContent = plant.emoji || "\u{1F331}";
    if (size) span.style.fontSize = size;
    return span;
  }
  const svg = svgEl("svg", {viewBox:"0 0 24 24", class:"mark", focusable:"false", "aria-hidden":"true"});
  svg.style.color = plant.color;
  if (size){ svg.style.width = size; svg.style.height = size; }
  form.forEach(function(spec){ svg.appendChild(svgEl(spec[0], spec[1], spec[2])); });

}

/* localStorage is a convenience, never load bearing. The app is fine without it. */
const store = {
  get: function(k){ try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set: function(k, v){ try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
};
const STORE_KEY = "garden-planner-v1";

/* ---------- state --------------------------------------------------------- */
/* One farm holds one plant library, one set of frost dates, and any number of
   layouts. A layout is a whole garden: its own plot, beds and containers. Use
   them for separate sites, for this year against next year, or for two ways of
   arranging the same ground. */
const state = {
  farm: initialFarm(),
  layouts: [initialLayout("Main garden")],
  activeId: null,
  customPlants: [],
  ui: {tab:"planner", theme:"garden", selected:null, filterType:"all", search:"",
       calMine:false, debug:false, hover:null, testResults:null, editing:null, dragging:null,
       day:todayDoy(), inspect:null, evidenceOnly:false, painting:false, journalFilter:"all",
       emojiMarks:false, mode:"today", open:{}, horizon:7, showDone:false, calView:"timing", gantt:null}
};
state.activeId = state.layouts[0].id;

function layoutById(id){ return state.layouts.filter(function(l){ return l.id === id; })[0]; }
function activeLayout(){
  let l = layoutById(state.activeId);
  if (!l || l.archived) l = state.layouts.filter(function(x){ return !x.archived; })[0];
  if (!l){ l = initialLayout("Main garden"); state.layouts.push(l); }
  state.activeId = l.id;
  return l;
}
/* The rest of the app was written against state.beds, state.plot and
   state.containers. These keep that surface and point it at the active layout,
   so a layout switch is a one line change rather than a rewrite. */
["beds", "plot", "containers"].forEach(function(key){
  Object.defineProperty(state, key, {
    get:function(){ return activeLayout()[key]; },
    set:function(v){ activeLayout()[key] = v; }
  });
});

/* ---------- frost dates and timing projection ------------------------------ */
function doy(md){ return MONTH_CUM[md[0]] + md[1]; }
function todayDoy(){
  const n = new Date();
  return MONTH_CUM[n.getMonth()] + n.getDate();
}
function fromDoy(n){
  let d = Math.max(1, Math.min(365, Math.round(n)));
  for (let m = 11; m >= 0; m--) if (d > MONTH_CUM[m]) return [m, d - MONTH_CUM[m]];
  return [0, d];
}
function fmtDate(n){ const md = fromDoy(n); return MONTHS[md[0]] + " " + md[1]; }
function zoneById(id){ return ZONES.filter(function(z){ return z.id === id; })[0]; }
function frostFree(){ return !state.farm.lastFrost || !state.farm.firstFrost; }
function farmFrost(){
  if (frostFree()) return {last:1, first:365};
  return {last:doy(state.farm.lastFrost), first:doy(state.farm.firstFrost)};
}
function seasonDays(){ const f = farmFrost(); return f.first - f.last; }
function setZone(id){
  const z = zoneById(id);
  if (!z) return;
  state.farm.zone = id;
  state.farm.custom = false;
  state.farm.lastFrost = z.last ? z.last.slice() : null;
  state.farm.firstFrost = z.first ? z.first.slice() : null;
}
/* Move one reference day onto this farm's calendar. Whichever frost the day sits
   closer to is the one it travels with. */
function projectDay(refDay){
  const f = farmFrost();
  return (Math.abs(refDay - REF_FROST.last) <= Math.abs(refDay - REF_FROST.first))
    ? refDay - REF_FROST.last + f.last
    : refDay - REF_FROST.first + f.first;
}
/* Spans come back as fractions of the year so the calendar can draw them. */
function projectedSpans(plant, key){
  const raw = parseSpan(plant.zone7a ? plant.zone7a[key] : null);
  const out = [];
  raw.forEach(function(sp){
    if (sp.s === 0 && sp.e === 1){ out.push({s:0, e:1, full:true}); return; }
    let s = projectDay(sp.s * 365);
    let e = projectDay(sp.e * 365);
    if (e <= s) return;
    s = Math.max(0, Math.min(365, s));
    e = Math.max(0, Math.min(365, e));
    if (e - s < 1) return;
    out.push({s:s / 365, e:e / 365, startDay:s, endDay:e});
  });
  return out;
}
/* Honest about the edges. Each stage is compared with the length it has in the
   reference zone: when a short season squeezes a window down to a sliver, say
   so rather than drawing a confident little bar over three days. */
function seasonNote(plant){
  if (frostFree()) return null;
  const keys = ["indoor", "transplant", "direct", "harvest"];
  const len = function(spans){
    return spans.reduce(function(a, sp){ return a + (sp.e - sp.s) * 365; }, 0);
  };
  let anyRaw = false, worst = 1;
  keys.forEach(function(k){
    const raw = parseSpan(plant.zone7a ? plant.zone7a[k] : null);
    if (!raw.length) return;
    anyRaw = true;
    const rl = len(raw);
    if (rl <= 0) return;
    worst = Math.min(worst, len(projectedSpans(plant, k)) / rl);
  });
  if (!anyRaw) return null;
  if (worst < 0.1) return "No usable window here. This one wants a longer season.";
  if (worst < 0.6) return "The window here is tight. Look for a short season variety.";
  return null;
}


/* ---------- plant index and relationships --------------------------------- */
function allPlants(){ return PLANT_LIBRARY.concat(state.customPlants); }
let PLANT_MAP = {};
let REL = {};
function reindex(){
  PLANT_MAP = {};
  allPlants().forEach(function(p){ PLANT_MAP[p.id] = p; });
  /* Companion data in the wild is written one way round only, so build the
     relation both ways. Hovering strawberry over kale should read the same as
     hovering kale over strawberry. */
  REL = {};
  allPlants().forEach(function(p){ REL[p.id] = {friend:{}, foe:{}}; });
  allPlants().forEach(function(p){
    (p.companions || []).forEach(function(o){ if (REL[o]) { REL[p.id].friend[o] = true; REL[o].friend[p.id] = true; } });
    (p.avoid || []).forEach(function(o){ if (REL[o]) { REL[p.id].foe[o] = true; REL[o].foe[p.id] = true; } });
  });
  /* A conflict always outranks a friendship. */
  allPlants().forEach(function(p){
    Object.keys(REL[p.id].foe).forEach(function(o){ delete REL[p.id].friend[o]; });
  });
}
function documented(a, b){
  return DOCUMENTED.indexOf(a + "|" + b) >= 0 || DOCUMENTED.indexOf(b + "|" + a) >= 0;
}
function relation(a, b){
  if (!a || !b || a === b) return null;
  if (!REL[a] || !REL[b]) return null;
  if (state.ui.evidenceOnly && !documented(a, b)) return null;
  if (REL[a].foe[b]) return "foe";
  if (REL[a].friend[b]) return "friend";
  return null;
}
function plantName(id){ return PLANT_MAP[id] ? PLANT_MAP[id].name : id; }
function bedById(id){ return state.beds.filter(function(b){ return b.id === id; })[0]; }
function inPlot(bed){ return bed && bed.kind !== "border"; }

/* ---------- the plot grid -------------------------------------------------- */
function slotAt(r, c){ return r * state.plot.cols + c; }
function plotFind(bedId){
  const i = state.plot.slots.indexOf(bedId);
  return i < 0 ? null : {i:i, r:Math.floor(i / state.plot.cols), c:i % state.plot.cols};
}
function plotAddRow(where){
  if (state.plot.rows >= PLOT_MAX) return false;
  const blank = new Array(state.plot.cols).fill(null);
  state.plot.slots = (where === "top") ? blank.concat(state.plot.slots) : state.plot.slots.concat(blank);
  state.plot.rows++;
  return true;
}
function plotAddCol(where){
  if (state.plot.cols >= PLOT_MAX) return false;
  const next = [];
  for (let r = 0; r < state.plot.rows; r++){
    const row = state.plot.slots.slice(r * state.plot.cols, (r + 1) * state.plot.cols);
    next.push.apply(next, (where === "left") ? [null].concat(row) : row.concat([null]));
  }
  state.plot.slots = next;
  state.plot.cols++;
  return true;
}
/* Trim empty edges so the grid does not creep outward every time a bed moves. */
function plotTrim(){
  const rowEmpty = function(r){
    for (let c = 0; c < state.plot.cols; c++) if (state.plot.slots[slotAt(r, c)]) return false;
    return true;
  };
  const colEmpty = function(c){
    for (let r = 0; r < state.plot.rows; r++) if (state.plot.slots[slotAt(r, c)]) return false;
    return true;
  };
  let changed = false;
  while (state.plot.rows > 1 && rowEmpty(0)){ state.plot.slots.splice(0, state.plot.cols); state.plot.rows--; changed = true; }
  while (state.plot.rows > 1 && rowEmpty(state.plot.rows - 1)){ state.plot.slots.length -= state.plot.cols; state.plot.rows--; changed = true; }
  while (state.plot.cols > 1 && colEmpty(0)){
    const next = [];
    for (let r = 0; r < state.plot.rows; r++) next.push.apply(next, state.plot.slots.slice(r * state.plot.cols + 1, (r + 1) * state.plot.cols));
    state.plot.slots = next; state.plot.cols--; changed = true;
  }
  while (state.plot.cols > 1 && colEmpty(state.plot.cols - 1)){
    const next = [];
    for (let r = 0; r < state.plot.rows; r++) next.push.apply(next, state.plot.slots.slice(r * state.plot.cols, (r + 1) * state.plot.cols - 1));
    state.plot.slots = next; state.plot.cols--; changed = true;
  }
  return changed;
}
/* A bed that is not in the plot cannot be seen or edited, so never leave one
   stranded: drop slot entries pointing at nothing, then seat every orphan. */
function reconcilePlot(){
  const p = state.plot;
  p.rows = Math.max(1, Math.min(PLOT_MAX, Math.floor(p.rows) || 1));
  p.cols = Math.max(1, Math.min(PLOT_MAX, Math.floor(p.cols) || 1));
  const slots = new Array(p.rows * p.cols).fill(null);
  const seated = {};
  for (let i = 0; i < slots.length; i++){
    const id = p.slots[i];
    const bed = id ? bedById(id) : null;
    if (bed && inPlot(bed) && !seated[id]){ slots[i] = id; seated[id] = true; }
  }
  p.slots = slots;
  state.beds.filter(inPlot).forEach(function(bed){
    if (seated[bed.id]) return;
    let free = p.slots.indexOf(null);
    if (free < 0){
      if (!plotAddRow("bottom")) return;
      free = p.slots.indexOf(null);
    }
    if (free >= 0){ p.slots[free] = bed.id; seated[bed.id] = true; }
  });
}

/* ---------- what is planted, and when -------------------------------------
   A square is no longer a slot holding one plant forever. A bed carries a list
   of plantings, each one a plant, an anchor square, and the days it occupies the
   ground. The same square can be lettuce in April and beans in June, which is
   what square foot gardening actually is. Windows may run past day 365 for
   anything that overwinters, garlic being the obvious one.                    */
function spanOf(id){ const p = PLANT_MAP[id]; return (p && p.span) ? p.span : 1; }
function heightOf(id){ const p = PLANT_MAP[id]; return HEIGHT_RANK[p && p.height] || 0; }
function familyOf(id){ const p = PLANT_MAP[id]; return (p && p.family) || "other"; }

/* The stretch a plant holds the square: out of doors, through to the end of
   picking. Time under lights indoors does not tie up a square. */
function occWindow(plant){
  if (!plant) return {s:1, e:365};
  const outs = [];
  ["transplant", "direct"].forEach(function(k){
    projectedSpans(plant, k).forEach(function(sp){ if (sp.startDay) outs.push(sp.startDay); });
  });
  const har = projectedSpans(plant, "harvest");
  if (har.length && har[0].full) return {s:1, e:365};
  let s = outs.length ? Math.min.apply(null, outs) : (har.length ? Math.max(1, har[0].startDay - 60) : 1);
  let e = har.length ? Math.max.apply(null, har.map(function(x){ return x.endDay; })) : s + 90;
  s = Math.round(s); e = Math.round(e);
  if (e <= s) e += 365;                       /* overwinters, garlic and the like */
  if (e - s > 365) e = s + 365;
  return {s:s, e:e};
}
function inWindow(w, day){
  if (w.e > 365) return day >= w.s || day <= w.e - 365;
  return day >= w.s && day <= w.e;
}
function windowSegs(w){ return w.e > 365 ? [[w.s, 365], [1, w.e - 365]] : [[w.s, w.e]]; }
function windowsClash(a, b){
  const A = windowSegs(a), B = windowSegs(b);
  for (const x of A) for (const y of B) if (x[0] <= y[1] && y[0] <= x[1]) return true;
  return false;
}
function windowText(w){
  return fmtDate(w.s) + " to " + fmtDate(w.e > 365 ? w.e - 365 : w.e) + (w.e > 365 ? " the year after" : "");
}
function coverage(bed, anchor, id){
  const n = spanOf(id);
  const r = Math.floor(anchor / bed.cols), c = anchor % bed.cols;
  const out = [];
  for (let dr = 0; dr < n; dr++) for (let dc = 0; dc < n; dc++){
    const rr = r + dr, cc = c + dc;
    if (rr < bed.rows && cc < bed.cols) out.push(rr * bed.cols + cc);
  }
  return out;
}
function fits(bed, anchor, id){
  const n = spanOf(id);
  const r = Math.floor(anchor / bed.cols), c = anchor % bed.cols;
  return (r + n <= bed.rows) && (c + n <= bed.cols);
}
/* What stands in each square. A day of null is the whole season at once, which
   is how you plan in February: every square shows its first crop of the year and
   says how many follow. */
function seasonView(){ return state.ui.mode === "season"; }
function viewDay(){ return seasonView() ? null : state.ui.day; }
function bedCellsAt(bed, day){
  const whole = (day === null || day === undefined);
  const out = new Array(bed.cols * bed.rows).fill(null);
  const list = (bed.plantings || []).slice().sort(function(a, b){ return a.s - b.s; });
  list.forEach(function(pl){
    if (!whole && !inWindow(pl, day)) return;
    coverage(bed, pl.i, pl.p).forEach(function(idx, k){
      if (out[idx]) { out[idx].more++; return; }
      out[idx] = {p:pl.p, pl:pl, anchor:k === 0, more:0};
    });
  });
  return out;
}
function plantingsAt(bed, idx, day){
  const whole = (day === null || day === undefined);
  return (bed.plantings || []).filter(function(pl){
    if (!whole && !inWindow(pl, day)) return false;
    return coverage(bed, pl.i, pl.p).indexOf(idx) >= 0;
  });
}
/* Do these two hold the ground together? On a given day, both are simply live.
   Across a season, they have to overlap in time to be in each other's way. */
function together(a, b, day){
  if (day === null || day === undefined) return windowsClash(a, b);
  return inWindow(a, day) && inWindow(b, day);
}
function idsAt(bed, day){
  const whole = (day === null || day === undefined);
  const seen = {};
  (bed.plantings || []).forEach(function(pl){ if (whole || inWindow(pl, day)) seen[pl.p] = true; });
  return Object.keys(seen);
}
function plantingsCovering(bed, idx){
  return (bed.plantings || []).filter(function(pl){ return coverage(bed, pl.i, pl.p).indexOf(idx) >= 0; });
}
function canPlant(bed, anchor, id, win){
  if (!fits(bed, anchor, id)) return {ok:false, why:plantName(id) + " needs " + spanOf(id) + " squares each way and runs off the edge here."};
  const cov = coverage(bed, anchor, id);
  const clash = (bed.plantings || []).filter(function(pl){
    return windowsClash(pl, win) && coverage(bed, pl.i, pl.p).some(function(x){ return cov.indexOf(x) >= 0; });
  })[0];
  if (clash) return {ok:false, why:"That ground is held by " + plantName(clash.p) + " from " + windowText(clash) + "."};
  return {ok:true};
}
function retime(pl){
  if (!pl.dtm) return pl;
  pl.e = pl.s + Math.max(7, pl.dtm);
  return pl;
}
function addPlanting(bed, anchor, id, startDay){
  const base = occWindow(PLANT_MAP[id]);
  const win = (startDay === undefined || startDay === null)
    ? base
    : {s:startDay, e:startDay + (base.e - base.s)};
  const check = canPlant(bed, anchor, id, win);
  if (!check.ok) return check;
  bed.plantings.push({id:"pl_" + Date.now() + "_" + Math.floor(Math.random() * 1e4),
                      p:id, i:anchor, s:win.s, e:win.e, v:null, dtm:null, a:{}});
  return {ok:true};
}
/* Move a planting to a different sowing date, keeping however long it takes. */
function reschedule(bed, pl, startDay){
  const len = pl.dtm ? Math.max(7, pl.dtm) : (pl.e - pl.s);
  const want = {s:startDay, e:startDay + len};
  const others = bed.plantings.filter(function(x){ return x !== pl; });
  const cov = coverage(bed, pl.i, pl.p);
  const clash = others.filter(function(x){
    return windowsClash(x, want) && coverage(bed, x.i, x.p).some(function(y){ return cov.indexOf(y) >= 0; });
  })[0];
  if (clash) return {ok:false, why:"That ground is held by " + plantName(clash.p) + " from " + windowText(clash) + "."};
  pl.s = want.s; pl.e = want.e;
  return {ok:true};
}
/* What could still follow in this square this season. A crop qualifies if its
   own sowing window is still open, or if it can simply be sown later and still
   finish: a second sowing of lettuce in August is the whole point of the thing. */
function successors(bed, idx, afterDay){
  const f = farmFrost();
  const out = [];
  allPlants().forEach(function(p){
    if (p.archived || p.place === "container" || p.place === "isolate") return;
    if (bed.kind === "border" ? p.place !== "border" : p.place === "border") return;
    if (bed.kind === "container" && p.place === "border") return;
    const w = occWindow(p);
    if (w.e > 365) return;                       /* overwinterers get sown on their own date */
    const len = w.e - w.s;
    const start = Math.max(afterDay, w.s);
    if (start + len > 365) return;
    /* Tender things must finish before the frost takes them. Hardy things get a
       three week grace, since a light frost sweetens as much as it kills. */
    if (!frostFree() && start + len > f.first + 21) return;
    if (!canPlant(bed, idx, p.id, {s:start, e:start + len}).ok) return;
    out.push({plant:p, start:start, shifted:start > w.s + 3});
  });
  return out.sort(function(a, b){ return a.start - b.start; });
}
function tally(day){
  const t = {};
  function bump(id, squares, plants){
    if (!id) return;
    const p = PLANT_MAP[id];
    if (!t[id]) t[id] = {squares:0, plants:0, plantings:0};
    t[id].squares += squares;
    t[id].plants += squares * (p ? p.per : 1);
    t[id].plantings += plants;
  }
  state.beds.forEach(function(b){
    (b.plantings || []).forEach(function(pl){
      const live = day === undefined || inWindow(pl, day);
      if (!live) { bump(pl.p, 0, 1); return; }
      bump(pl.p, coverage(b, pl.i, pl.p).length, 1);
    });
  });
  state.containers.forEach(function(c){
    if (c.archived) return;
    (c.plantings || []).forEach(function(pl){
      const live = day === undefined || inWindow(pl, day);
      bump(pl.p, live ? 1 : 0, 1);
    });
  });
  return t;
}
/* Conflicts are now judged in time and in space: two plants only argue if they
   share the ground on the same day, and sharing a bed is a milder thing than
   sitting in the next square. */
function bedConflicts(bed, day){
  const near = [], far = [];
  const pairKey = function(a, b){ return [plantName(a), plantName(b)].sort().join(" and "); };
  const ids = idsAt(bed, day);
  for (let i = 0; i < ids.length; i++)
    for (let j = i + 1; j < ids.length; j++)
      if (relation(ids[i], ids[j]) === "foe") far.push(pairKey(ids[i], ids[j]));
  for (let idx = 0; idx < bed.cols * bed.rows; idx++){
    const r = Math.floor(idx / bed.cols), c = idx % bed.cols;
    const here = plantingsAt(bed, idx, day);
    if (!here.length) continue;
    [[0,1],[1,0]].forEach(function(d){
      const rr = r + d[0], cc = c + d[1];
      if (rr >= bed.rows || cc >= bed.cols) return;
      plantingsAt(bed, rr * bed.cols + cc, day).forEach(function(other){
        here.forEach(function(mine){
          if (mine === other || mine.p === other.p) return;
          if (!together(mine, other, day)) return;
          if (relation(mine.p, other.p) === "foe") near.push(pairKey(mine.p, other.p));
        });
      });
    });
  }
  const nearSet = Array.from(new Set(near));
  return {near:nearSet, far:Array.from(new Set(far)).filter(function(x){ return nearSet.indexOf(x) < 0; })};
}
/* North is up. A tall plant throws its shade northward, onto whatever sits in
   the rows above it, for as long as the two share the ground. */
function shadeWarnings(bed, day){
  const out = [];
  for (let idx = 0; idx < bed.cols * bed.rows; idx++){
    const tall = plantingsAt(bed, idx, day).filter(function(pl){ return heightOf(pl.p) >= 2; });
    if (!tall.length) continue;
    const r = Math.floor(idx / bed.cols), c = idx % bed.cols;
    for (let back = 1; back <= 2; back++){
      const rr = r - back;
      if (rr < 0) break;
      for (let dc = -1; dc <= 1; dc++){
        const cc = c + dc;
        if (cc < 0 || cc >= bed.cols) continue;
        plantingsAt(bed, rr * bed.cols + cc, day).forEach(function(other){
          const p = PLANT_MAP[other.p];
          if (heightOf(other.p) >= 2 || (p && p.shade === "tolerant")) return;
          tall.forEach(function(t){
            if (t.p === other.p || !together(t, other, day)) return;
            /* Being shaded by a friend is usually the point. Beans climb the corn
               and squash runs under it, and none of that wants a warning. */
            if (relation(t.p, other.p) === "friend") return;
            out.push(plantName(t.p) + " will shade the " + plantName(other.p).toLowerCase() +
                     " to its north. Move the tall row to the north edge, or use the shade for something that wants it.");
          });
        });
      }
    }
  }
  return Array.from(new Set(out));
}
/* Shade does not stop at the bed frame. A tall crop on the north row of the bed
   to the south throws its shadow straight onto this one. */
function plotShadeWarnings(bed, day){
  if (!inPlot(bed)) return [];
  const pos = plotFind(bed.id);
  if (!pos || pos.r + 1 >= state.plot.rows) return [];
  const southId = state.plot.slots[slotAt(pos.r + 1, pos.c)];
  const south = southId ? bedById(southId) : null;
  if (!south) return [];
  const tall = [];
  for (let c = 0; c < south.cols; c++)
    plantingsAt(south, c, day).forEach(function(pl){
      if (heightOf(pl.p) >= 2 && tall.indexOf(pl.p) < 0) tall.push(pl.p);
    });
  if (!tall.length) return [];
  const shaded = [];
  for (let c = 0; c < bed.cols; c++)
    plantingsAt(bed, (bed.rows - 1) * bed.cols + c, day).forEach(function(pl){
      const p = PLANT_MAP[pl.p];
      /* Inside a bed a mid height crop can be smothered. Across a path with a gap
         between the frames, only genuinely short crops lose out. */
      if (heightOf(pl.p) >= 1 || (p && p.shade === "tolerant")) return;
      if (tall.some(function(tid){ return relation(tid, pl.p) === "friend"; })) return;
      if (shaded.indexOf(pl.p) < 0) shaded.push(pl.p);
    });
  if (!shaded.length) return [];

    if (p.place === "border" && bed.kind !== "border")
      out.push(p.name + " is a border plant. Move it to the perimeter so it does not shade the bed.");

/* Rotation reads across layouts. Give a layout a year and it becomes a season

  const here = activeLayout();
  const year = Number(here.year) || null;
  if (!year) return [];
  const mine = {};
  (bed.plantings || []).forEach(function(pl){ mine[familyOf(pl.p)] = true; });
  const out = [];
  state.layouts.forEach(function(l){
    if (l.id === here.id) return;
    const y = Number(l.year);
    if (!y || y >= year) return;
    const past = l.beds.filter(function(b){ return b.id === bed.id; })[0];
    if (!past) return;
    const gap = year - y;
    const seen = {};

      const fam = familyOf(pl.p);
      if (!mine[fam] || seen[fam]) return;

    for (let i = 0; i < line.length; i++){
      const ch = line[i];

  };

  const tCol = findCol(["tmin", "temp_min", "min_temp", "mintemp", "low", "minimum", "min"]);
  if (dCol < 0 || tCol < 0) return {ok:false, why:"No date and minimum temperature columns found. Headers seen: " + head.slice(0, 8).join(", ")};

    if (m[1].length === 4){ y = +m[1]; mo = +m[2]; da = +m[3]; } else { mo = +m[1]; da = +m[2]; y = +m[3]; }

    }

    return {year:y, last:years[y].last, first:years[y].first};

  if (!list.length) return {ok:false, why:"Read " + rows + " rows, and not one of them fell to freezing. Check the units."};

    const vals = list.map(function(r){ return r[key]; }).filter(function(v){ return v !== null; });

    return Math.round(vals.reduce(function(a, b){ return a + b; }, 0) / vals.length);
  };

    const vals = list.map(function(r){ return r[key]; }).filter(function(v){ return v !== null; });

}

  state.beds.forEach(function(b){ (b.plantings || []).forEach(function(pl){ out.push.apply(out, plantingTasks(pl, b)); }); });
  state.containers.filter(function(c){ return !c.archived; })
    .forEach(function(c){ (c.plantings || []).forEach(function(pl){ out.push.apply(out, plantingTasks(pl, c)); }); });
  return out.sort(function(a, b){ return a.day - b.day; });
}
/* Days are days of the year, so the window wraps at the turn. */
function daysBetween(from, to){
  let d = to - from;
  if (d < -180) d += 365;
  if (d > 180) d -= 365;
  return d;
}
function tasksInWindow(from, span){
  return allTasks().filter(function(t){
    const d = daysBetween(from, t.day);
    return d >= 0 && d < span;
  }).sort(function(a, b){ return daysBetween(from, a.day) - daysBetween(from, b.day); });
}
function overdueTasks(today, back){
  return allTasks().filter(function(t){
    if (t.done) return false;
    const d = daysBetween(t.day, today);
    return d > 0 && d <= back;
  }).sort(function(a, b){ return daysBetween(b.day, today) - daysBetween(a.day, today); });
}

/* ---------- seed order ------------------------------------------------------ */
/* Seed keeps for a few years and then does not. This is the usual rule of thumb,
   not a germination test, and the app says so rather than pretending. */
function viability(plant, age){
  /* No year on the packet is treated as fresh, the same as buying new, so that
     writing down what you have moves the shortfall by exactly that many seeds
     rather than nudging the arithmetic sideways. */
  if (!plant || !plant.life) return 0.9;
  if (age === null || age === undefined) return 0.9;
  if (age <= 0) return 0.9;
  const frac = age / plant.life;
  if (frac >= 1.3) return 0.05;
  return Math.max(0.05, 0.9 * (1 - 0.7 * frac));
}
function seedKey(id, variety){ return id + "|" + (variety || ""); }
function seedStock(){
  const map = {};
  (state.farm.seeds || []).forEach(function(s){ map[seedKey(s.p, s.v)] = s; });
  return map;
}
function seedPlan(){
  const need = {};
  const bump = function(pl, squares){
    const p = PLANT_MAP[pl.p];
    if (!p) return;
    const k = seedKey(pl.p, pl.v);
    if (!need[k]) need[k] = {p:pl.p, v:pl.v || null, plant:p, squares:0, plants:0, sowings:0};
    need[k].squares += squares;
    need[k].plants += squares * p.per;
    need[k].sowings++;
  };
  state.beds.forEach(function(b){
    (b.plantings || []).forEach(function(pl){ bump(pl, coverage(b, pl.i, pl.p).length); });
  });
  state.containers.filter(function(c){ return !c.archived; })
    .forEach(function(c){ (c.plantings || []).forEach(function(pl){ bump(pl, 1); }); });

  const stock = seedStock();
  const year = Number(activeLayout().year) || new Date().getFullYear();
  return Object.keys(need).map(function(k){
    const row = need[k];
    const have = stock[k] || null;
    const age = have && have.year ? Math.max(0, year - have.year) : null;
    const v = have ? viability(row.plant, age) : 0.9;
    /* Sow more than you want to keep: some will not come up, and a few get
       thinned or eaten. */
    const toSow = Math.ceil(row.plants / Math.max(0.05, v) * 1.15);
    const onHand = have && have.count ? have.count : 0;
    return {key:k, p:row.p, v:row.v, plant:row.plant, squares:row.squares, plants:row.plants,
            sowings:row.sowings, have:have, age:age, viability:v, toSow:toSow,
            onHand:onHand, short:Math.max(0, toSow - onHand),
            unit:row.plant.prop || "seeds"};
  }).sort(function(a, b){ return b.short - a.short || a.plant.name.localeCompare(b.plant.name); });
}

/* ---------- harvest load ---------------------------------------------------- */
/* Everything ripening at once is a problem of its own. */
function harvestCurve(){
  const weeks = new Array(53).fill(0);
  const who = [];
  for (let i = 0; i < 53; i++) who.push({});
  const add = function(pl, squares){
    const p = PLANT_MAP[pl.p];
    if (!p || !p.lbs) return;
    const start = stageDay(pl, "harvest");
    if (start === null) return;
    let end = pl.e > 365 ? pl.e - 365 : pl.e;
    let len = daysBetween(start, end);
    if (len <= 0) len = 14;
    const total = p.lbs * squares;
    /* Picking builds, peaks in the middle, and tails off. Spreading the whole
       crop evenly hides exactly the peak this chart exists to show. */
    const shape = [];
    let sum = 0;
    for (let d = 0; d < len; d++){
      const wgt = Math.sin(Math.PI * (d + 0.5) / len);
      shape.push(wgt);
      sum += wgt;
    }
    for (let d = 0; d < len; d++){
      const day = ((start - 1 + d) % 365) + 1;
      const wk = Math.min(52, Math.floor((day - 1) / 7));
      const lb = total * shape[d] / sum;
      weeks[wk] += lb;
      who[wk][pl.p] = (who[wk][pl.p] || 0) + lb;
    }
  };
  state.beds.forEach(function(b){
    (b.plantings || []).forEach(function(pl){ add(pl, coverage(b, pl.i, pl.p).length); });
  });
  state.containers.filter(function(c){ return !c.archived; })
    .forEach(function(c){ (c.plantings || []).forEach(function(pl){ add(pl, 1); }); });
  return {weeks:weeks, who:who};
}
function harvestNotes(){
  const curve = harvestCurve();
  const people = Math.max(1, Number(state.farm.people) || 2);
  const capacity = people * APPETITE_LB;
  const out = [];
  const f = farmFrost();
  curve.weeks.forEach(function(lb, wk){
    if (lb <= capacity * 1.5) return;
    const day = wk * 7 + 1;
    const top = Object.keys(curve.who[wk]).sort(function(a, b){ return curve.who[wk][b] - curve.who[wk][a]; })[0];
    out.push({kind:"glut", week:wk, day:day, lb:lb,
      text:"Week of " + fmtDate(day) + ": about " + Math.round(lb) + " lb ripening, mostly " +
           plantName(top).toLowerCase() + ". That is " + (lb / capacity).toFixed(1) +
           " times what " + people + " " + (people === 1 ? "person eats" : "people eat") +
           " fresh. Can it, freeze it, give it away, or stagger the sowings so it does not all land at once."});
  });
  /* A gap only counts inside the growing season. Nothing ripens in January and
     nobody needs telling. */
  let run = null;
  for (let wk = 0; wk < 53; wk++){
    const day = wk * 7 + 1;
    const inSeason = frostFree() || (day >= f.last && day <= f.first);
    if (inSeason && curve.weeks[wk] < capacity * 0.15){
      if (!run) run = {from:wk, to:wk}; else run.to = wk;
    } else if (run){
      if (run.to - run.from >= 2) out.push({kind:"gap", week:run.from, day:run.from * 7 + 1,
        text:"Nothing much to pick from " + fmtDate(run.from * 7 + 1) + " to " + fmtDate(run.to * 7 + 7) +
             ". A succession sowing would fill it."});
      run = null;
    }
  }
  if (run && run.to - run.from >= 2) out.push({kind:"gap", week:run.from, day:run.from * 7 + 1,
    text:"Nothing much to pick from " + fmtDate(run.from * 7 + 1) + " to " + fmtDate(Math.min(365, run.to * 7 + 7)) + "."});
  return {curve:curve, notes:out, capacity:capacity, people:people};
}

/* ---------- rolling a year forward ------------------------------------------ */
/* The rotation checker knows the rule. This makes it do the work: crops move to
   the bed that has gone longest without their family. */
function familyHistory(beforeYear){
  const seen = {};
  state.layouts.forEach(function(l){
    const y = Number(l.year);
    if (!y || y >= beforeYear) return;
    l.beds.forEach(function(b){
      (b.plantings || []).forEach(function(pl){
        const k = b.id + "|" + familyOf(pl.p);
        if (!seen[k] || seen[k] < y) seen[k] = y;
      });
    });
  });
  return seen;
}
function permutations(list){
  if (list.length <= 1) return [list];
  const out = [];
  list.forEach(function(item, i){
    const rest = list.slice(0, i).concat(list.slice(i + 1));
    permutations(rest).forEach(function(p){ out.push([item].concat(p)); });
  });
  return out;
}
/* Score one bed taking one crop set: years since that family last grew there,
   with a real penalty for coming back too soon. */
function rotationScore(bedId, families, year, history){
  let score = 0;
  families.forEach(function(fam){
    const last = history[bedId + "|" + fam];
    const wants = ROTATE_YEARS[fam] || 1;
    const gap = last ? year - last : 99;
    score += Math.min(gap, wants * 2);
    if (gap < wants) score -= (wants - gap) * 6;
  });
  return score;
}
function planRotation(layout, year){
  const history = familyHistory(year);
  /* Every bed of the right size is a candidate, planted or not. Leaving the
     empty ones out was what pinned a crop in place when it had somewhere to go. */
  const beds = layout.beds.filter(inPlot);
  const groups = {};
  beds.forEach(function(b){
    const k = b.cols + "x" + b.rows;
    (groups[k] = groups[k] || []).push(b);
  });
  const moves = {};
  const stuck = [];
  Object.keys(groups).forEach(function(k){
    const group = groups[k];
    const ids = group.map(function(b){ return b.id; });
    if (group.length === 1){ moves[group[0].id] = group[0].id; return; }
    if (group.length > 7){
      /* Too many to try every arrangement, so take the best available in turn. */
      const free = ids.slice();
      group.forEach(function(b){
        const fams = Array.from(new Set((b.plantings || []).map(function(pl){ return familyOf(pl.p); })));
        let best = free[0], bestScore = -1e9;
        free.forEach(function(target){
          const sc = rotationScore(target, fams, year, history);
          if (sc > bestScore){ bestScore = sc; best = target; }
        });
        moves[b.id] = best;
        free.splice(free.indexOf(best), 1);
      });
      return;
    }
    const famsOf = group.map(function(b){
      return Array.from(new Set((b.plantings || []).map(function(pl){ return familyOf(pl.p); })));
    });
    let best = null, bestScore = -1e9;
    permutations(ids).forEach(function(order){
      let sc = 0;
      order.forEach(function(target, i){ sc += rotationScore(target, famsOf[i], year, history); });
      if (sc > bestScore){ bestScore = sc; best = order; }
    });
    best.forEach(function(target, i){ moves[group[i].id] = target; });
  });
  layout.beds.forEach(function(b){
    if (!moves[b.id]) moves[b.id] = b.id;
    const alone = groups[b.cols + "x" + b.rows] && groups[b.cols + "x" + b.rows].length === 1;
    if (inPlot(b) && (b.plantings || []).length && alone) stuck.push(b.name);
  });
  return {moves:moves, stuck:stuck};
}
function rollForward(){
  const src = activeLayout();
  const year = (Number(src.year) || new Date().getFullYear()) + 1;
  const plan = planRotation(src, year);
  snapshot();
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = "layout_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
  copy.name = String(year) + " season";
  copy.year = year;
  copy.archived = false;
  /* Lift every crop, then set it down in the bed the rotation chose. */
  const carried = {};
  copy.beds.forEach(function(b){ carried[b.id] = b.plantings || []; b.plantings = []; });
  const report = [];
  Object.keys(carried).forEach(function(fromId){
    const toId = plan.moves[fromId] || fromId;
    const dst = copy.beds.filter(function(b){ return b.id === toId; })[0];
    if (!dst) return;
    dst.plantings = carried[fromId].map(function(pl){
      return {id:"pl_" + Date.now() + "_" + Math.floor(Math.random() * 1e4), p:pl.p, i:pl.i,
              s:pl.s, e:pl.e, v:pl.v || null, dtm:pl.dtm || null, a:{}};
    });
    if (toId !== fromId){
      const from = src.beds.filter(function(b){ return b.id === fromId; })[0];
      report.push((from ? from.name : fromId) + " to " + dst.name);
    }
  });
  state.layouts.push(copy);
  state.activeId = copy.id;
  reconcilePlot();
  persist();
  render();
  return {year:year, moved:report, stuck:plan.stuck};
}

function showTip(target, p){
  if (!p) return;
  const tip = qs("#tooltip");
  clear(tip);
  const friends = Object.keys(REL[p.id] ? REL[p.id].friend : {}).slice(0, 4).map(plantName);
  const foes = Object.keys(REL[p.id] ? REL[p.id].foe : {}).slice(0, 4).map(plantName);
  const w = occWindow(p);
  add(tip, h("b", null, glyph(p, "18px"), " " + p.name));
  add(tip, h("div", {text:p.per + " per square foot" + (p.span > 1 ? ", spreads over " + p.span + " by " + p.span : "")}));
  add(tip, h("div", {text:"Holds the ground " + windowText(w)}));
  if (friends.length) add(tip, h("div", {class:"g", text:"Good with: " + friends.join(", ")}));
  if (foes.length) add(tip, h("div", {class:"b", text:"Keep apart from: " + foes.join(", ")}));

  tip.classList.remove("hidden");
  tip.setAttribute("aria-hidden", "false");
  const r = target.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;

  let y = r.top - th - 8;
  if (y < 6) y = r.bottom + 8;
  x = Math.max(6, Math.min(x, window.innerWidth - tw - 6));
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}

}

/* ---------- planting ------------------------------------------------------- */
function plantAt(bedId, idx, quiet){
  const bed = bedById(bedId);
  const sel = state.ui.selected;
  if (!bed) return false;
  if (!sel){ inspectSquare(bedId, idx); return false; }
  const res = addPlanting(bed, idx, sel);
  if (!res.ok){ if (!quiet) toast(res.why); return false; }
  return true;
}
function clearAt(bedId, idx){
  const bed = bedById(bedId);
  if (!bed) return false;
  const day = viewDay();
  const here = plantingsCovering(bed, idx);
  const live = (day === null) ? [] : here.filter(function(pl){ return inWindow(pl, day); });
  const drop = live.length ? live : here;
  if (!drop.length) return false;
  bed.plantings = bed.plantings.filter(function(pl){ return drop.indexOf(pl) < 0; });
  return true;
}
function commit(changed, msg){
  if (!changed) return;
  persist();
  render();
  if (msg) toast(msg);
}
function gridKeys(e, bed, idx){
  const map = {ArrowRight:1, ArrowLeft:-1, ArrowDown:bed.cols, ArrowUp:-bed.cols};
  if (map[e.key] !== undefined){
    const next = idx + map[e.key];
    if (next < 0 || next >= bed.cols * bed.rows) return;
    if ((e.key === "ArrowRight" && next % bed.cols === 0) ||
        (e.key === "ArrowLeft" && idx % bed.cols === 0)) return;
    e.preventDefault();
    focusSquare(bed.id, next);
    return;
  }
  if (e.key === "Delete" || e.key === "Backspace"){
    e.preventDefault();
    snapshot();
    commit(clearAt(bed.id, idx));
    focusSquare(bed.id, idx);
  }
}
function focusSquare(bedId, idx){
  const bed = bedById(bedId);
  if (!bed) return;
  let btn = document.querySelector('.sq[data-bed="' + bedId + '"][data-idx="' + idx + '"]');
  if (!btn){
    /* the square may be under a spreading plant, so focus its anchor instead */
    const cover = plantingsCovering(bed, idx)[0];
    if (cover) btn = document.querySelector('.sq[data-bed="' + bedId + '"][data-idx="' + cover.i + '"]');
  }
  if (btn) btn.focus();
}

        if (e.button !== 0 || !state.ui.selected) return;

      },
      onpointerenter:function(e){
        setHover(bed.id, (cell ? cell.p : null) || state.ui.selected);
        if (p) showTip(sq, p);
        const pn = state.ui.painting;
        if (!pn || pn.bed !== bed.id || !state.ui.selected) return;
        if (e.buttons !== 1){ state.ui.painting = false; return; }
        if (!pn.snapped){ snapshot(); pn.snapped = true; }
        if (plantAt(bed.id, idx, true)) pn.changed = true;
      },
      onmouseleave:function(){ setHover(null, null); hideTip(); },
      onfocus:function(){ setHover(bed.id, (cell ? cell.p : null) || state.ui.selected); if (p) showTip(sq, p); },
      onblur:function(){ setHover(null, null); hideTip(); },

  conflicts.far.forEach(function(c){ add(flags, h("div", {class:"note warn", text:"Sharing the bed: " + c})); });
  warnings.forEach(function(w){ add(flags, h("div", {class:"note warn", text:w})); });
  if (flags.childNodes.length) add(wrap, flags);

  /* One control on the face of the bed. Everything else lives in the editor,
     so the map reads as a garden rather than a control panel. */
  add(wrap, h("button", {class:"btn ghost tiny bed-edit", type:"button",
    "aria-expanded":state.ui.editing === bed.id,
    text:state.ui.editing === bed.id ? "Close" : "Edit",
    "aria-label":(state.ui.editing === bed.id ? "Close" : "Edit") + " " + bed.name,
    onclick:function(){ state.ui.editing = (state.ui.editing === bed.id) ? null : bed.id; renderPlanner(); }}));
  if (state.ui.editing === bed.id) add(wrap, bedEditor(bed));
  return wrap;
}

function resizeBed(bed, cols, rows){
  let lost = 0;
  const kept = [];
  bed.plantings.forEach(function(pl){
    const r = Math.floor(pl.i / bed.cols), c = pl.i % bed.cols;
    const n = spanOf(pl.p);
    if (r + n <= rows && c + n <= cols){ pl.i = r * cols + c; kept.push(pl); } else lost++;
  });
  bed.cols = cols; bed.rows = rows; bed.plantings = kept;
  return lost;
}
function copyBed(src, dst, mode){
  let skipped = 0;
  dst.plantings = [];
  src.plantings.forEach(function(pl){
    const r = Math.floor(pl.i / src.cols), c = pl.i % src.cols;
    let rr = r, cc = c;
    if (mode === "h") cc = src.cols - 1 - c - (spanOf(pl.p) - 1);
    if (mode === "v") rr = src.rows - 1 - r - (spanOf(pl.p) - 1);
    if (rr < 0 || cc < 0 || rr >= dst.rows || cc >= dst.cols){ skipped++; return; }
    const idx = rr * dst.cols + cc;
    const win = {s:pl.s, e:pl.e};
    if (!canPlant(dst, idx, pl.p, win).ok){ skipped++; return; }
    dst.plantings.push({id:"pl_" + Date.now() + "_" + Math.floor(Math.random() * 1e4),
                        p:pl.p, i:idx, s:pl.s, e:pl.e, a:{}});
  });
  return skipped;
}
function mirrorBed(bed, axis){
  const src = {cols:bed.cols, rows:bed.rows, plantings:bed.plantings.slice()};
  bed.plantings = [];
  return copyBed(src, bed, axis);
}
function moveBed(bedId, dr, dc){
  let pos = plotFind(bedId);
  if (!pos) return;
  snapshot();
  if (dr < 0 && pos.r === 0 && !plotAddRow("top")) { toast("The plot is already at its full height"); return; }
  if (dc < 0 && pos.c === 0 && !plotAddCol("left")) { toast("The plot is already at its full width"); return; }
  if (dr > 0 && pos.r === state.plot.rows - 1 && !plotAddRow("bottom")) { toast("The plot is already at its full height"); return; }
  if (dc > 0 && pos.c === state.plot.cols - 1 && !plotAddCol("right")) { toast("The plot is already at its full width"); return; }
  pos = plotFind(bedId);
  const to = slotAt(pos.r + dr, pos.c + dc);
  const held = state.plot.slots[to];
  state.plot.slots[to] = bedId;
  state.plot.slots[pos.i] = held || null;
  plotTrim();
  persist(); render();
  const btn = document.querySelector('[aria-label^="Move ' + (bedById(bedId) || {}).name + '"]');
  if (btn) btn.focus();
}
function swapSlots(a, b){
  if (a === b) return;
  snapshot();
  const tmp = state.plot.slots[a];
  state.plot.slots[a] = state.plot.slots[b];
  state.plot.slots[b] = tmp;
  plotTrim();
  persist(); render();
}
function applyPlan(bed){
  const plan = PLAN[bed.id];
  if (!plan) return;
  bed.plantings = [];
  for (let i = 0; i < bed.cols * bed.rows; i++){
    const row = Math.floor(i / bed.cols), col = i % bed.cols;
    let id = null;
    if (plan.rows) id = plan.rows[row % plan.rows.length][col % plan.rows[row % plan.rows.length].length];
    else if (plan.rowCycle) id = plan.rowCycle[row % plan.rowCycle.length];
    else if (plan.cycle) id = plan.cycle[i % plan.cycle.length];
    else id = plan.fill;
    if (plan.lastRow && row === bed.rows - 1) id = plan.lastRow[col % plan.lastRow.length];
    if (id) addPlanting(bed, i, id);
  }
}

/* Two clicks, and the second one has to land inside ten seconds. Destructive

let clearArmed = false;

function clearAllButton(){
  const btn = h("button", {class:"btn " + (clearArmed ? "" : "ghost") + " tiny", type:"button", "aria-live":"polite",
    style:clearArmed ? {background:"var(--bad)", borderColor:"var(--bad)", color:"var(--panel)"} : null,
    text:clearArmed ? "Click again to clear everything" : "Clear everything",

        clearArmed = true;

        renderPlanner();
        const again = document.querySelector('[aria-live="polite"].btn');
        if (again) again.focus();
        toast("Click again within ten seconds to clear the whole layout");

      snapshot();
      state.beds.forEach(function(b){ b.plantings = []; });
      state.containers.forEach(function(c){ c.plant = null; });
      commit(true, "Layout cleared. Ctrl+Z puts it back.");

/* ---------- variety and days to maturity ----------------------------------
   The library holds one timing for a crop. A variety is where the real number
   lives, and the packet always tells you: put it in and the window follows.  */
function varietyRow(pl, bed){
  const row = h("div", {class:"row", style:{marginTop:"4px"}});
  const vIn = h("input", {class:"input-sm", value:pl.v || "", placeholder:"Variety, as on the packet",
    "aria-label":"Variety", style:{flex:"1 1 160px"},
    onchange:function(e){ pl.v = e.target.value.trim().slice(0, 40) || null; persist(); }});
  const dIn = h("input", {class:"input-sm", type:"number", min:"7", max:"400", value:pl.dtm || "",
    placeholder:"Days", "aria-label":"Days to maturity", style:{width:"92px"},
    onchange:function(e){
      const v = Math.floor(Number(e.target.value));
      snapshot();
      pl.dtm = (v >= 7 && v <= 400) ? v : null;
      retime(pl);
      commit(true, pl.dtm ? ("Window set to " + windowText(pl)) : "Back to the library timing");
    }});
  add(row, vIn);
  add(row, dIn);
  add(row, h("span", {class:"per", text:"days to maturity"}));
  if (bed){
    const mSel = h("select", {class:"input-sm", "aria-label":"Sowing month"});
    MONTHS.forEach(function(m, i){ add(mSel, h("option", {value:i, selected:fromDoy(pl.s)[0] === i, text:m})); });
    const dayIn = h("input", {class:"input-sm", type:"number", min:"1", max:"31", value:fromDoy(pl.s)[1],
      "aria-label":"Sowing day", style:{width:"70px"}});
    const move = function(){
      const want = doy([Number(mSel.value), Math.max(1, Math.min(31, Number(dayIn.value) || 1))]);
      snapshot();
      const res = reschedule(bed, pl, want);
      if (!res.ok){ toast(res.why); undoStack.pop(); render(); return; }
      commit(true, "Moved to " + windowText(pl));
    };
    mSel.addEventListener("change", move);
    dayIn.addEventListener("change", move);
    add(row, h("span", {class:"per", text:"sown"}));
    add(row, mSel);
    add(row, dayIn);
  }
  return row;
}

/* ---------- calendar ------------------------------------------------------ */
/* "Feb-Mar" and "Mar-May" become fractions of the year. "Year-round" fills the
   track. A range that wraps the new year, like garlic sown Oct and lifted Jun,
   comes back as two spans instead of vanishing. */
function parseSpan(str){
  if (!str) return [];
  const t = String(str).trim();
  if (/^year/i.test(t)) return [{s:0, e:1}];
  const out = [];
  t.split(",").forEach(function(part){
    const bits = part.trim().split("-").map(function(x){ return MONTHS.indexOf(x.trim().slice(0, 3)); });
    const s = bits[0];
    if (s < 0) return;
    let e = (bits.length > 1 && bits[1] >= 0) ? bits[1] : s;
    if (e < s) { out.push({s:s / 12, e:1}); out.push({s:0, e:(e + 1) / 12}); }
    else out.push({s:s / 12, e:(e + 1) / 12});
  });
  return out;
}
const CAL_LANES = [
  {key:"indoor", color:"var(--indoor)", label:"Start indoors", top:2},
  {key:"transplant", color:"var(--transplant)", label:"Transplant out", top:6.5},
  {key:"direct", color:"var(--direct)", label:"Direct sow", top:11},
  {key:"harvest", color:"var(--harvest)", label:"Harvest", top:15.5}
];
function spanText(plant, key){
  const raw = parseSpan(plant.zone7a ? plant.zone7a[key] : null);
  if (!raw.length) return null;
  const sp = projectedSpans(plant, key);
  if (!sp.length) return "no window here";
  if (sp[0].full) return "year round";
  return sp.map(function(x){ return fmtDate(x.startDay) + " to " + fmtDate(x.endDay); }).join(", ");
}
function calTrack(plant){
  const track = h("div", {class:"cal-track"});
  const months = h("div", {class:"cal-months"});
  for (let i = 0; i < 12; i++) add(months, h("i"));
  add(track, months);
  const f = farmFrost();
  if (!frostFree()){
    add(track, h("div", {class:"cal-frost-zone", style:{left:"0", width:(f.last / 365 * 100) + "%"}}));
    add(track, h("div", {class:"cal-frost-zone", style:{left:(f.first / 365 * 100) + "%", right:"0"}}));
  }
  if (plant) CAL_LANES.forEach(function(lane){
    projectedSpans(plant, lane.key).forEach(function(sp){
      add(track, h("div", {class:"cal-bar", title:lane.label,
        style:{left:(sp.s * 100) + "%", width:Math.max(0.6, (sp.e - sp.s) * 100) + "%",
               top:lane.top + "px", background:lane.color}}));
    });
  });
  if (!frostFree()){
    add(track, h("div", {class:"cal-frost", title:"Last frost, " + fmtDate(f.last), style:{left:(f.last / 365 * 100) + "%"}}));
    add(track, h("div", {class:"cal-frost", title:"First frost, " + fmtDate(f.first), style:{left:(f.first / 365 * 100) + "%"}}));
  }
  return track;
}

      res.years.slice(-12).forEach(function(r){

          h("span", {class:"per", text:"first frost " + (r.first ? fmtDate(r.first) : "none recorded")})));
      });
      add(results, table);
      const use = function(pair, label){
        if (!pair.last || !pair.first) return null;
        return h("button", {class:"btn tiny", type:"button",
          text:label + ": " + fmtDate(pair.last) + " to " + fmtDate(pair.first),

    text:"One honest caveat: the library holds researched Zone 7a timing and everything else is that timing shifted onto your frost dates. It gets you close. It does not know your soil temperature, your day length or which varieties you grow."}));

  liveLayouts().forEach(function(l){

    const yearIn = h("input", {class:"input-sm", type:"number", min:"1900", max:"2200", value:l.year || "",

    add(card, h("button", {class:"btn ghost tiny", type:"button", text:"Save", onclick:function(){
      const v = noteIn.value.trim().slice(0, 40);
      if (!v) { toast("Give the layout a name"); return; }
      snapshot();
      l.name = v;

    }}));
    if (!active) add(card, h("button", {class:"btn tiny", type:"button", text:"Open", onclick:function(){ switchLayout(l.id); toast("Opened " + l.name); }}));
    add(card, h("button", {class:"btn ghost tiny", type:"button", text:"Duplicate", onclick:function(){ duplicateLayout(l.id); }}));
    add(card, h("button", {class:"btn ghost tiny", type:"button", text:"Archive", onclick:function(){ archiveLayout(l.id, true); }}));
    add(lBox, card);
  });
  const newIn = h("input", {class:"input-sm", placeholder:"New layout name", "aria-label":"New layout name", style:{width:"180px"}});
  add(lBox, h("div", {class:"row", style:{marginTop:"10px"}}, newIn,
    h("button", {class:"btn tiny", type:"button", text:"Start an empty layout", onclick:function(){
      newLayout(newIn.value.trim().slice(0, 40) || ("Layout " + (state.layouts.length + 1)));
    }}),
    h("button", {class:"btn ghost tiny", type:"button", text:"Copy the open one", onclick:function(){
      duplicateLayout(state.activeId, newIn.value.trim().slice(0, 40) || null);
    }}),
    h("button", {class:"btn tiny", type:"button", text:"Roll forward a year and rotate", onclick:function(){
      const res = rollForward();

                             : (res.year + " planned. Nothing needed moving."));
    }})));
  add(lBox, h("p", {class:"lede", style:{margin:"6px 0 0"},
    text:"Rolling forward copies the open layout into next year and moves each bed's crops to whichever bed of the same size has gone longest without that family. Beds with no twin of the same size stay put."}));
  const gone = state.layouts.filter(function(l){ return l.archived; });
  if (gone.length){
    add(lBox, h("h3", {class:"sec-title", style:{marginTop:"16px"}, text:"Archived layouts"}));

        h("button", {class:"btn ghost tiny", type:"button", text:"Restore", onclick:function(){ archiveLayout(l.id, false); }})));

  }
  add(host, lBox);
