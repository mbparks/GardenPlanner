/* ---------- journal: what actually happened -------------------------------- */
const OUTCOMES = [["", "not recorded"], ["good", "did well"], ["poor", "disappointing"], ["failed", "failed"]];
function allPlantings(){
  const out = [];
  state.beds.forEach(function(b){
    (b.plantings || []).forEach(function(pl){ out.push({bed:b, pl:pl}); });
  });
  state.containers.filter(function(c){ return !c.archived; }).forEach(function(c){
    (c.plantings || []).forEach(function(pl){ out.push({bed:c, pl:pl, pot:true}); });
  });
  return out.sort(function(a, b){ return a.pl.s - b.pl.s; });
}
function journalCsv(){
  const rows = [["layout", "year", "bed", "row", "column", "plant", "variety", "days to maturity", "family",
                 "planned out", "planned end", "sown", "up", "planted out", "first pick", "last pick",
                 "yield", "outcome", "photo", "note"]];
  const l = activeLayout();
  allPlantings().forEach(function(e){
    const a = e.pl.a || {};
    const d = function(v){ return v ? fmtDate(v > 365 ? v - 365 : v) : ""; };
    rows.push([l.name, l.year || "", e.bed.name,
               e.pot ? "" : Math.floor(e.pl.i / e.bed.cols) + 1, e.pot ? "" : e.pl.i % e.bed.cols + 1,
               plantName(e.pl.p), e.pl.v || "", e.pl.dtm || "", FAMILY_NAMES[familyOf(e.pl.p)] || "",
               d(e.pl.s), d(e.pl.e), d(a.sown), d(a.up), d(a.out), d(a.first), d(a.last),
               a.yield || "", a.outcome || "", a.photo || "", a.note || ""]);
  });
  return toCsv(rows);
}
function renderJournal(){
  const host = qs("#panel-journal");
  clear(host);
  const l = activeLayout();
  add(host, h("h2", {text:"Journal"}));
  add(host, h("p", {class:"lede",
    text:"What the plan said against what the ground did, for " + l.name + (l.year ? " in " + l.year : "") +
         ". Next February this is worth more than the seed catalogue."}));

  const bar = h("div", {class:"row", style:{marginBottom:"14px"}});
  add(bar, segmented([["all", "Everything"], ["open", "Not recorded"], ["done", "Recorded"], ["failed", "Failures"]],
    state.ui.journalFilter, function(v){ state.ui.journalFilter = v; persist(); renderJournal(); }, "Which entries"));
  add(bar, h("button", {class:"btn tiny", type:"button", text:"Export this season as CSV", onclick:function(){
    downloadFile(slug(l.name, "season") + "-journal.csv", journalCsv(), "text/csv");
    toast("Journal exported");
  }}));
  add(host, bar);

  const entries = allPlantings().filter(function(e){
    const a = e.pl.a || {};
    const any = a.sown || a.up || a.out || a.first || a.last || a.yield || a.outcome || a.note;
    if (state.ui.journalFilter === "open") return !any;
    if (state.ui.journalFilter === "done") return !!any;
    if (state.ui.journalFilter === "failed") return a.outcome === "failed" || a.outcome === "poor";
    return true;
  });
  if (!entries.length){
    add(host, h("p", {class:"lede", text:"Nothing here yet. Plant something on the Planner tab and it appears in this list."}));
    return;
  }
  entries.forEach(function(e){
    const p = PLANT_MAP[e.pl.p];
    const a = e.pl.a = e.pl.a || {};
    const card = h("div", {class:"journal-row"});
    add(card, h("div", {class:"row", style:{gap:"8px"}},
      p ? glyph(p, "20px") : h("span", {text:"\u00b7"}),
      h("b", {text:p ? p.name : e.pl.p}),
      e.pl.v ? h("span", {class:"per", text:e.pl.v}) : null,
      h("span", {class:"pill", text:e.pot ? e.bed.name
        : (e.bed.name + ", row " + (Math.floor(e.pl.i / e.bed.cols) + 1) +
           " column " + (e.pl.i % e.bed.cols + 1))}),
      h("span", {class:"per", text:"planned " + windowText(e.pl)}),
      h("button", {class:"btn ghost tiny", type:"button", text:"Lift", onclick:function(){
        snapshot();
        e.bed.plantings = e.bed.plantings.filter(function(x){ return x !== e.pl; });
        persist(); render(); toast((p ? p.name : "Planting") + " lifted");
      }})));
    const dates = h("div", {class:"journal-dates"});
    [["Sown", "sown"], ["Up", "up"], ["Out", "out"], ["First pick", "first"], ["Last pick", "last"]]
      .forEach(function(f){
        add(dates, dateFields(f[0], a[f[1]], function(v){ a[f[1]] = v; persist(); }, {clearable:true}));
      });
    add(card, dates);
    const foot = h("div", {class:"row", style:{marginTop:"6px"}});
    const yieldIn = h("input", {class:"input-sm", value:a.yield || "", placeholder:"Yield, in whatever unit you actually use",
      "aria-label":"Yield", style:{flex:"1 1 220px"},
      onchange:function(ev){ a.yield = ev.target.value.trim().slice(0, 30) || null; persist(); }});
    const outSel = h("select", {class:"input-sm", "aria-label":"How it went",
      onchange:function(ev){ a.outcome = ev.target.value || null; persist(); renderJournal(); }});
    OUTCOMES.forEach(function(o){ add(outSel, h("option", {value:o[0], selected:(a.outcome || "") === o[0], text:o[1]})); });
    add(foot, yieldIn); add(foot, outSel);
    add(card, foot);
    const photoRow = h("div", {class:"row", style:{marginTop:"6px"}});
    const photoIn = h("input", {class:"input-sm", value:a.photo || "",
      placeholder:"Photo, by name or path. The picture itself stays where it is.",
      "aria-label":"Photo reference", style:{flex:"1 1 240px"},
      onchange:function(ev){ a.photo = ev.target.value.trim().slice(0, 200) || null; persist(); renderJournal(); }});
    add(photoRow, photoIn);
    /* Only a real, safe scheme becomes a link. Anything else stays as text. */
    if (a.photo && /^(https?|file):\/\//i.test(a.photo))
      add(photoRow, h("a", {href:a.photo, target:"_blank", rel:"noopener noreferrer", text:"Open"}));
    add(card, photoRow);
    const noteIn = h("textarea", {class:"input-sm", rows:"2", placeholder:"What happened, and why you think so",
      "aria-label":"Note", style:{width:"100%", marginTop:"6px", resize:"vertical"},
      onchange:function(ev){ a.note = ev.target.value.trim().slice(0, 300) || null; persist(); }});
    noteIn.value = a.note || "";
    add(card, noteIn);
    if (a.outcome) card.classList.add("outcome-" + a.outcome);
    add(host, card);
  });
}

/* ---------- this week ------------------------------------------------------- */
const HORIZONS = [["7", "This week"], ["14", "Two weeks"], ["30", "This month"], ["365", "The whole season"]];
function markTaskDone(t, day){
  snapshot();
  t.pl.a = t.pl.a || {};
  t.pl.a[TASK_KINDS[t.kind].records] = day;
  persist();
  render();
  toast(TASK_KINDS[t.kind].label + ": " + t.plant.name + " noted for " + fmtDate(day));
}
function taskLine(t, today){
  const off = daysBetween(today, t.day);
  const row = h("div", {class:"task" + (t.done ? " done" : "") + (off < 0 ? " late" : "")});
  add(row, h("span", {class:"task-kind tone-" + TASK_KINDS[t.kind].tone, text:TASK_KINDS[t.kind].label}));
  add(row, glyph(t.plant, "18px"));
  const body = h("div", {class:"task-body"});
  add(body, h("div", null, h("b", {text:t.plant.name}), t.pl.v ? h("span", {class:"per", text:", " + t.pl.v}) : null));
  add(body, h("div", {class:"per", text:t.where}));
  add(row, body);
  add(row, h("span", {class:"per task-when",
    text:off === 0 ? "today" : (off > 0 ? fmtDate(t.day) : fmtDate(t.day) + ", " + (-off) + " days ago")}));
  if (t.done) add(row, h("span", {class:"tag good", text:"done " + fmtDate(t.doneDay)}));
  else add(row, h("button", {class:"btn ghost tiny", type:"button", text:"Did it",
    onclick:function(){ markTaskDone(t, todayDoy()); }}));
  return row;
}
const DO_VIEWS = [["week", "What is due"], ["seeds", "Seed order"]];
function renderDo(){
  const host = qs("#panel-do");
  clear(host);
  const view = state.ui.doView || "week";
  add(host, segmented(DO_VIEWS, view, function(v){ state.ui.doView = v; persist(); renderDo(); }, "Which list"));
  const body = h("div", {class:"tab-body"});
  add(host, body);
  if (view === "seeds") renderSeeds(body); else renderWeek(body);
}
function renderWeek(host){
  const l = activeLayout();
  const year = Number(l.year) || null;
  const ahead = year && year > new Date().getFullYear();
  /* A layout for a year that has not arrived is a plan, not a chore list, so it
     starts at the turn of its own year and nothing in it is late. */
  const today = ahead ? 1 : todayDoy();
  const span = ahead ? 365 : (Number(state.ui.horizon) || 7);
  add(host, h("h2", {text:ahead ? ("The season ahead, " + year) : "This week"}));
  add(host, h("p", {class:"lede",
    text:ahead
      ? (l.name + " is planned for " + year + ", so this is the whole run of work in order rather than a list for today.")
      : ("Read off " + l.name + " for " + fmtDate(today) +
         ". Every line comes from a planting you already made, so if a date looks wrong the planting is what to fix.")}));
  const bar = h("div", {class:"row", style:{marginBottom:"14px"}});
  if (!ahead) add(bar, segmented(HORIZONS, String(span), function(v){
    state.ui.horizon = Number(v); persist(); renderDo();
  }, "How far ahead"));
  add(bar, h("button", {class:"btn ghost tiny", type:"button", "aria-pressed":!!state.ui.showDone,
    text:"Include what is done", onclick:function(){ state.ui.showDone = !state.ui.showDone; persist(); renderDo(); }}));
  add(host, bar);

  const late = ahead ? [] : overdueTasks(today, 21);
  if (late.length){
    add(host, h("h3", {class:"sec-title", text:"Behind"}));
    late.slice(0, 12).forEach(function(t){ add(host, taskLine(t, today)); });
  }
  const upcoming = tasksInWindow(today, span).filter(function(t){ return state.ui.showDone || !t.done; });
  if (!upcoming.length){
    add(host, h("p", {class:"lede", style:{marginTop:"14px"},
      text:late.length ? "Nothing else falls due in this stretch." :
        "Nothing due. Either the garden is between jobs or nothing is planted yet."}));
  }
  let lastDay = null;
  upcoming.forEach(function(t){
    if (t.day !== lastDay){
      const off = daysBetween(today, t.day);
      add(host, h("h3", {class:"sec-title", style:{marginTop:"14px"},
        text:ahead ? fmtDate(t.day)
          : (off === 0 ? "Today, " : (off === 1 ? "Tomorrow, " : "")) + fmtDate(t.day) +
            (off > 1 && !ahead ? ", in " + off + " days" : "")}));
      lastDay = t.day;
    }
    add(host, taskLine(t, today));
  });
}

/* ---------- seed order ------------------------------------------------------ */
function renderSeeds(host){
  const rows = seedPlan();
  const year = Number(activeLayout().year) || new Date().getFullYear();
  add(host, h("h2", {text:"Seed order"}));
  add(host, h("p", {class:"lede",
    text:"Squares times plants per square, divided by how well the seed is likely to come up, for " +
         activeLayout().name + ". Tell it what is in the box and it will only ask you to buy the difference."}));
  add(host, h("p", {class:"lede", style:{marginTop:"-12px"},
    text:"Viability here is the usual rule of thumb for how long each kind keeps, not a germination test. If a packet matters, sow ten on a damp paper towel and count."}));

  const short = rows.filter(function(r){ return r.short > 0; });
  add(host, h("div", {class:"row", style:{marginBottom:"14px"}},
    h("span", {class:"note " + (short.length ? "warn" : "good"),
      text:short.length ? (short.length + " of " + rows.length + " lines need buying")
                        : (rows.length ? "Everything planned is covered by what you have" : "Nothing planted yet")}),
    h("button", {class:"btn tiny", type:"button", text:"Export the order as CSV", onclick:function(){
      const head = ["crop", "variety", "squares", "plants wanted", "unit", "on hand", "packet year",
                    "assumed viability", "to sow", "to buy"];
      const lines = [head].concat(rows.map(function(r){
        return [r.plant.name, r.v || "", r.squares, r.plants, r.unit, r.onHand, r.have && r.have.year || "",
                Math.round(r.viability * 100) + "%", r.toSow, r.short];
      }));
      downloadFile("seed-order-" + year + ".csv", toCsv(lines), "text/csv");
      toast("Seed order exported");
    }})));

  if (!rows.length){
    add(host, h("p", {class:"lede", text:"Plant something on the Planner tab and the order builds itself."}));
    return;
  }
  rows.forEach(function(r){
    const card = h("div", {class:"seed-row" + (r.short ? " short" : "")});
    add(card, h("div", {class:"row", style:{gap:"8px"}},
      glyph(r.plant, "20px"),
      h("b", {text:r.plant.name}),
      r.v ? h("span", {class:"pill", text:r.v}) : null,
      h("span", {class:"per", text:r.squares + " sq ft, " + r.sowings + " sowing" + (r.sowings === 1 ? "" : "s") +
                                   ", " + r.plants + " plants wanted"}),
      h("span", {class:"per", style:{marginLeft:"auto"},
        text:r.short ? ("buy " + r.short + " " + r.unit) : "covered"})));
    const box = h("div", {class:"seed-stock"});
    const have = r.have || {};
    const countIn = h("input", {class:"input-sm", type:"number", min:"0", max:"100000", value:r.onHand || "",
      placeholder:"0", "aria-label":"How many " + r.unit + " of " + r.plant.name + " you have", style:{width:"92px"}});
    const yearIn = h("input", {class:"input-sm", type:"number", min:"1990", max:"2100", value:have.year || "",
      placeholder:"Year", "aria-label":"Packet year for " + r.plant.name, style:{width:"92px"}});
    const save = function(){
      const count = Math.max(0, Math.floor(Number(countIn.value) || 0));
      const y = Math.floor(Number(yearIn.value));
      state.farm.seeds = (state.farm.seeds || []).filter(function(s){ return seedKey(s.p, s.v) !== r.key; });
      if (count || (y >= 1990 && y <= 2100))
        state.farm.seeds.push({p:r.p, v:r.v || null, count:count, year:(y >= 1990 && y <= 2100) ? y : null});
      persist();
      renderDo();
    };
    countIn.addEventListener("change", save);
    yearIn.addEventListener("change", save);
    add(box, h("span", {class:"per", text:"On hand"}));
    add(box, countIn);
    add(box, h("span", {class:"per", text:r.unit + ", bought"}));
    add(box, yearIn);
    add(box, h("span", {class:"per",
      text:r.have ? (r.age === null ? "no year given, assuming fresh"
                                    : (r.age + " year" + (r.age === 1 ? "" : "s") + " old, about " +
                                       Math.round(r.viability * 100) + "% likely to come up"))
                  : "nothing recorded, priced as a fresh packet"}));
    add(box, h("span", {class:"per", text:"Sow " + r.toSow + " to get " + r.plants}));
    add(card, box);
    if (r.plant.prop) add(card, h("div", {class:"per", style:{marginTop:"4px"},
      text:r.plant.name + " is not grown from seed here. Order " + r.plant.prop + "."}));
    if (r.age !== null && r.age > r.plant.life) add(card, h("div", {class:"note warn", style:{marginTop:"6px"},
      text:"That packet is past the age " + r.plant.name.toLowerCase() + " usually keeps. Test it before you count on it."}));
    add(host, card);
  });
}

/* ---------- bed occupancy and harvest load ---------------------------------- */
function renderOccupancy(host){
  const beds = state.beds.concat(state.containers.filter(function(c){ return !c.archived; }));
  if (!state.ui.gantt || !beds.some(function(b){ return b.id === state.ui.gantt; }))
    state.ui.gantt = (beds[0] || {}).id;
  const bed = beds.filter(function(b){ return b.id === state.ui.gantt; })[0];
  const pick = h("select", {class:"input-sm", "aria-label":"Which bed to chart",
    onchange:function(e){ state.ui.gantt = e.target.value; renderCalendar(); }});
  beds.forEach(function(b){ add(pick, h("option", {value:b.id, selected:b.id === state.ui.gantt, text:b.name})); });
  add(host, h("div", {class:"row", style:{marginBottom:"12px"}},
    h("label", {class:"sec-title", style:{margin:0}, for:"gantt-pick", text:"Bed"}), pick));
  pick.id = "gantt-pick";
  if (!bed){ add(host, h("p", {class:"lede", text:"No beds in this layout yet."})); return; }

  const f = farmFrost();
  const head = h("div", {class:"cal-row"});
  add(head, h("div"));
  const hm = h("div", {style:{display:"grid", gridTemplateColumns:"repeat(12,1fr)"}});
  MONTHS.forEach(function(m){ add(hm, h("div", {class:"cal-head", text:m})); });
  add(head, hm);
  add(host, head);

  let empty = 0;
  for (let idx = 0; idx < bed.cols * bed.rows; idx++){
    const covering = plantingsCovering(bed, idx);
    const row = h("div", {class:"cal-row"});
    const label = bed.kind === "container" ? bed.name
      : "Row " + (Math.floor(idx / bed.cols) + 1) + ", col " + (idx % bed.cols + 1);
    add(row, h("button", {class:"btn ghost tiny gantt-label", type:"button", text:label,
      "aria-label":"Open " + label + " in the planner",
      onclick:function(){ state.ui.tab = "planner"; inspectSquare(bed.id, idx); }}));
    const track = h("div", {class:"cal-track gantt"});
    const months = h("div", {class:"cal-months"});
    for (let i = 0; i < 12; i++) add(months, h("i"));
    add(track, months);
    if (!frostFree()){
      add(track, h("div", {class:"cal-frost-zone", style:{left:"0", width:(f.last / 365 * 100) + "%"}}));
      add(track, h("div", {class:"cal-frost-zone", style:{left:(f.first / 365 * 100) + "%", right:"0"}}));
    }
    if (!covering.length) empty++;
    covering.forEach(function(pl){
      const p = PLANT_MAP[pl.p];
      windowSegs(pl).forEach(function(seg){
        const bar = h("div", {class:"gantt-bar", title:(p ? p.name : pl.p) + ", " + windowText(pl),
          style:{left:((seg[0] - 1) / 365 * 100) + "%", width:Math.max(0.8, (seg[1] - seg[0]) / 365 * 100) + "%",
                 background:(p ? p.color : "var(--accent)")}});
        add(bar, h("span", {text:p ? p.name : pl.p}));
        add(track, bar);
      });
    });
    add(track, h("div", {class:"gantt-today", title:"today",
      style:{left:(todayDoy() / 365 * 100) + "%"}}));
    add(row, track);
    add(host, row);
  }
  add(host, h("p", {class:"lede", style:{marginTop:"10px"},
    text:empty ? (empty + " square" + (empty === 1 ? " is" : "s are") +
                  " empty all year. Click one to see what would fit.")
               : "Every square is working this season. The gaps between bars are where a follow on crop could go."}));
}
function renderHarvestLoad(host){
  const res = harvestNotes();
  const peak = Math.max.apply(null, res.curve.weeks.concat([res.capacity]));
  add(host, h("p", {class:"lede",
    text:"Rough pounds ripening each week against what " + res.people + " " +
         (res.people === 1 ? "person eats" : "people eat") + " fresh, about " +
         res.capacity + " lb a week. Yields are ballpark figures per square foot, not a promise."}));
  const peopleIn = h("input", {class:"input-sm", type:"number", min:"1", max:"40", value:res.people,
    "aria-label":"People to feed", style:{width:"80px"},
    onchange:function(e){
      snapshot();
      state.farm.people = Math.max(1, Math.min(40, Math.floor(Number(e.target.value) || 2)));
      persist(); render();
    }});
  add(host, h("div", {class:"row", style:{marginBottom:"12px"}},
    h("span", {class:"per", text:"People to feed"}), peopleIn));

  const chart = h("div", {class:"load-chart", role:"img",
    style:{"--capacity":Math.min(96, res.capacity / Math.max(1, peak) * 100) + "%"},
    "aria-label":"Weekly harvest weight across the year, peaking at " + Math.round(peak) + " pounds"});
  res.curve.weeks.forEach(function(lb, wk){
    const col = h("div", {class:"load-col" + (lb > res.capacity * 1.5 ? " glut" : ""),
      title:fmtDate(wk * 7 + 1) + ": " + Math.round(lb) + " lb"});
    add(col, h("i", {style:{height:Math.round(lb / Math.max(1, peak) * 100) + "%"}}));
    add(chart, col);
  });
  add(host, chart);
  const line = h("div", {class:"load-axis"});
  MONTHS.forEach(function(m){ add(line, h("span", {text:m})); });
  add(host, line);
  add(host, h("div", {class:"row", style:{marginTop:"6px"}},
    h("span", {class:"per", text:"The dashed line is a week's eating. Bars past it are a glut."})));

  if (!res.notes.length) add(host, h("p", {class:"lede", style:{marginTop:"12px"},
    text:"Nothing arrives faster than you can eat it, and there is no long empty stretch in the season. That is a well spread plan."}));
  res.notes.forEach(function(n){
    add(host, h("div", {class:"note " + (n.kind === "glut" ? "warn" : ""), style:{marginTop:"8px"}}, n.text));
  });
}

/* ---------- about, self test, housekeeping -------------------------------- */
/* Point this at the repo once it exists. It is the only outbound link in the app. */
const REPO_URL = "https://github.com/mbparks";
const SUPPORT_URL = "https://buymeacoffee.com/mbparks";

function selfTest(){
  const r = [];
  function t(name, fn){
    try { const out = fn(); r.push({name:name, pass:out === true, detail:out === true ? "" : String(out)}); }
    catch (e) { r.push({name:name, pass:false, detail:String(e && e.message || e)}); }
  }
  t("Plant ids are unique", function(){
    const seen = {};
    for (const p of PLANT_LIBRARY){ if (seen[p.id]) return "duplicate id " + p.id; seen[p.id] = 1; }
    return true;
  });
  t("Densities and types are in range", function(){
    for (const p of PLANT_LIBRARY){
      if (!(p.per >= 1 && p.per <= 16)) return p.id + " has per " + p.per;
      if (TYPES.indexOf(p.type) < 0) return p.id + " has type " + p.type;
      if (["bed","border","container","isolate"].indexOf(p.place) < 0) return p.id + " has place " + p.place;
    }
    return true;
  });
  t("No companion or avoid entry points at a missing plant", function(){
    const known = {};
    PLANT_LIBRARY.forEach(function(p){ known[p.id] = 1; });
    const bad = [];
    PLANT_LIBRARY.forEach(function(p){
      p.companions.concat(p.avoid).forEach(function(o){ if (!known[o]) bad.push(p.id + " to " + o); });
    });
    return bad.length ? bad.join(", ") : true;
  });
  t("No pair is listed as both friend and foe", function(){
    const bad = [];
    PLANT_LIBRARY.forEach(function(p){
      p.companions.forEach(function(o){
        const q = PLANT_MAP[o];
        if (!q) return;
        if (p.avoid.indexOf(o) >= 0 || q.avoid.indexOf(p.id) >= 0) bad.push(p.id + " and " + o);
      });
    });
    return bad.length ? bad.join(", ") : true;
  });
  t("Relationships read the same in both directions", function(){
    if (relation("strawberry", "kale") !== "foe") return "strawberry to kale is " + relation("strawberry", "kale");
    if (relation("kale", "strawberry") !== "foe") return "kale to strawberry is " + relation("kale", "strawberry");
    if (relation("sunflower", "bean") !== "foe") return "sunflower to bean missed";
    if (relation("bean", "sunflower") !== "foe") return "bean to sunflower missed";
    return true;
  });
  t("Known rules hold", function(){
    if (relation("tomato", "basil") !== "friend") return "tomato and basil should be friends";
    if (relation("tomato", "pepper") !== "foe") return "tomato and pepper should be a conflict";
    if (relation("corn", "bean") !== "friend" || relation("bean", "squash") !== "friend" ||
        relation("corn", "squash") !== "friend") return "three sisters should all be friends";
    if (relation("tomato", "tomato") !== null) return "a plant should have no relation to itself";
    return true;
  });
  t("A square can hold two crops in one season but not at one time", function(){
    const bed = {id:"probe", name:"Probe", cols:2, rows:2, kind:"bed", plantings:[]};
    const spring = addPlanting(bed, 0, "radish");
    if (!spring.ok) return "radish would not go in";
    const clash = addPlanting(bed, 0, "radish");
    if (clash.ok) return "the same square took the same crop twice at once";
    const later = occWindow(PLANT_MAP.radish).e + 5;
    bed.plantings.push({id:"x", p:"kale", i:0, s:later, e:later + 60, a:{}});
    const day = later + 10;
    if (bedCellsAt(bed, day)[0].p !== "kale") return "the follow on crop is not showing";
    if (bedCellsAt(bed, occWindow(PLANT_MAP.radish).s + 1)[0].p !== "radish") return "the spring crop was lost";
    return true;
  });
  t("Two crops that never share a day never conflict", function(){
    const bed = {id:"probe", name:"Probe", cols:2, rows:1, kind:"bed", plantings:[
      {id:"a", p:"tomato", i:0, s:130, e:300, a:{}},
      {id:"b", p:"pepper", i:1, s:20, e:100, a:{}}
    ]};
    if (bedConflicts(bed, 60).near.length) return "flagged a conflict in a month they do not share";
    bed.plantings[1].s = 130; bed.plantings[1].e = 300;
    if (!bedConflicts(bed, 200).near.length) return "missed the conflict when they do share the ground";
    return true;
  });
  t("A neighbour is a stronger warning than a bed mate", function(){
    const bed = {id:"probe", name:"Probe", cols:4, rows:1, kind:"bed", plantings:[
      {id:"a", p:"tomato", i:0, s:1, e:365, a:{}},
      {id:"b", p:"potato", i:3, s:1, e:365, a:{}}
    ]};
    const far = bedConflicts(bed, 200);
    if (far.near.length || far.far.length !== 1) return "distance was ignored";
    bed.plantings[1].i = 1;
    const near = bedConflicts(bed, 200);
    return (near.near.length === 1 && near.far.length === 0) ? true : "neighbours were not promoted";
  });
  t("A spreading plant holds all of its squares and refuses to hang off the edge", function(){
    const bed = {id:"probe", name:"Probe", cols:3, rows:3, kind:"bed", plantings:[]};
    if (spanOf("squash") !== 2) return "squash lost its footprint";
    if (!addPlanting(bed, 0, "squash").ok) return "squash would not go in";
    const cells = bedCellsAt(bed, 200);
    const held = cells.filter(Boolean).length;
    if (held !== 4) return "it holds " + held + " squares instead of 4";
    if (addPlanting(bed, 1, "carrot").ok) return "a carrot was planted under the squash";
    if (addPlanting(bed, 2, "squash").ok) return "squash was allowed to hang off the right edge";
    return true;
  });
  t("Tall plants are flagged for shading what is north of them", function(){
    const bed = {id:"probe", name:"Probe", cols:2, rows:3, kind:"bed", plantings:[
      {id:"a", p:"pepper", i:0, s:1, e:365, a:{}},
      {id:"b", p:"corn", i:2, s:1, e:365, a:{}}
    ]};
    if (!shadeWarnings(bed, 200).length) return "corn south of peppers was not flagged";
    bed.plantings[0].p = "lettuce";
    if (shadeWarnings(bed, 200).length) return "lettuce was flagged, though it welcomes afternoon shade";
    bed.plantings[0].p = "pepper";
    bed.plantings[0].i = 4; bed.plantings[1].i = 0;
    return shadeWarnings(bed, 200).length ? "the shade was cast the wrong way, southward" : true;
  });
  t("Rotation reads backwards across the years", function(){
    const held = JSON.stringify({l:state.layouts, a:state.activeId});
    const past = initialLayout("Past"); past.year = 2025;
    past.beds = [{id:"bed-east", name:"East", cols:2, rows:1, kind:"bed",
                  plantings:[{id:"p1", p:"tomato", i:0, s:1, e:365, a:{}}]}];
    const now = initialLayout("Now"); now.year = 2026;
    now.beds = [{id:"bed-east", name:"East", cols:2, rows:1, kind:"bed",
                 plantings:[{id:"p2", p:"pepper", i:0, s:1, e:365, a:{}}]}];
    state.layouts = [past, now]; state.activeId = now.id;
    const warned = rotationWarnings(now.beds[0]).length;
    now.beds[0].plantings[0].p = "bean";
    const quiet = rotationWarnings(now.beds[0]).length;
    const back = JSON.parse(held);
    state.layouts = back.l; state.activeId = back.a;
    if (!warned) return "nightshade following nightshade was not flagged";
    if (quiet) return "an unrelated family was flagged";
    return true;
  });
  t("Soil volume follows the bed", function(){
    const v = bedVolume({cols:4, rows:8, depth:6});
    if (Math.abs(v.cuft - 16) > 0.01) return "got " + v.cuft + " cubic feet for a 4 by 8 at 6 inches";
    if (Math.abs(v.third - v.cuft / 3) > 0.01) return "the thirds do not divide";
    return true;
  });
  t("Overwintering crops keep their window across the new year", function(){
    const held = JSON.parse(JSON.stringify(state.farm));
    setZone("7a");
    const w = occWindow(PLANT_MAP.garlic);
    state.farm = held;
    if (w.e <= 365) return "garlic ends in the same year it was sown";
    if (!inWindow(w, 350) || !inWindow(w, 30)) return "the window does not carry over";
    if (inWindow(w, 240)) return "the window covers late summer, which it should not";
    return true;
  });
  t("The evidence filter narrows the pairings", function(){
    const held = state.ui.evidenceOnly;
    state.ui.evidenceOnly = false;
    const loose = relation("tomato", "basil");
    state.ui.evidenceOnly = true;
    const tight = relation("tomato", "basil");
    const kept = relation("corn", "bean");
    state.ui.evidenceOnly = held;
    if (loose !== "friend") return "basil and tomato are not friends in the loose view";
    if (tight !== null) return "an untested pairing survived the filter";
    if (kept !== "friend") return "a documented pairing was filtered out";
    return true;
  });
  t("Redo puts back what undo took", function(){
    const bed = state.beds.filter(inPlot)[0];
    if (!bed) return true;
    let free = -1;
    for (let i = 0; i < bed.cols * bed.rows; i++)
      if (canPlant(bed, i, "marigold", occWindow(PLANT_MAP.marigold)).ok){ free = i; break; }
    if (free < 0) return true;
    const before = bed.plantings.length;
    snapshot();
    addPlanting(bed, free, "marigold");
    const mid = state.beds.filter(inPlot)[0].plantings.length;
    undo();
    const after = state.beds.filter(inPlot)[0].plantings.length;
    redo();
    const again = state.beds.filter(inPlot)[0].plantings.length;
    undo();
    if (mid !== before + 1) return "the planting never landed";
    if (after !== before) return "undo did not remove it";
    return again === mid ? true : "redo did not put it back";
  });
  t("The journal exports one row per planting", function(){
    const csv = journalCsv().split("\n");
    const rows = allPlantings().length;
    return csv.length === rows + 1 ? true : csv.length + " lines for " + rows + " plantings";
  });
  t("The journal escapes commas and quotes", function(){
    const bed = state.beds.filter(inPlot)[0];
    if (!bed) return true;
    let free = -1;
    for (let i = 0; i < bed.cols * bed.rows; i++)
      if (canPlant(bed, i, "marigold", occWindow(PLANT_MAP.marigold)).ok){ free = i; break; }
    if (free < 0) return true;
    snapshot();
    addPlanting(bed, free, "marigold");
    const pl = bed.plantings[bed.plantings.length - 1];
    pl.a = {note:'sowed late, "again"'};
    const line = journalCsv().split("\n").filter(function(x){ return x.indexOf("sowed late") >= 0; })[0];
    undo();
    return (line && line.indexOf('"sowed late, ""again"""') >= 0) ? true : "got " + line;
  });
  t("A file from before seasons existed keeps every square", function(){
    const legacy = {app:"garden-planner", schema:4, layouts:[{id:"l1", name:"Old", beds:[
      {id:"bed-nw", name:"NW", cols:4, rows:4, cells:["tomato", null, "basil", "nope"]}]}]};
    const res = validate(legacy);
    if (!res.ok) return res.errs.join(", ");
    const pls = res.value.layouts[0].beds[0].plantings;
    if (pls.length !== 2) return pls.length + " plantings recovered from 2 planted squares";
    if (pls[0].p !== "tomato" || pls[0].i !== 0) return "the tomato moved";
    if (pls[1].p !== "basil" || pls[1].i !== 2) return "the basil moved";
    if (res.dropped.indexOf("nope") < 0) return "the unknown id was not reported";
    return true;
  });
  t("Every tab has a panel and every panel has a tab", function(){
    const missing = TABS.filter(function(t){ return !document.getElementById("panel-" + t[0]); })
      .map(function(t){ return t[1]; });
    if (missing.length) return "no panel for " + missing.join(", ");
    const panels = document.querySelectorAll('[id^="panel-"]').length;
    if (panels !== TABS.length) return panels + " panels for " + TABS.length + " tabs";
    const open = document.querySelectorAll('.tab-btn[aria-selected="true"]').length;

  });
  t("One control does one job, and choices look like choices", function(){
    /* A one of several choice is a segmented set. An on or off is a pressed
       button. Mixing the two was why the marks switch read as two buttons that
       did nothing. */
    let picked = null;
    const set = segmented([["a", "A"], ["b", "B"], ["c", "C"]], "b", function(v){ picked = v; }, "Probe");
    const kids = set.querySelectorAll("button[aria-pressed]");

    if (kids[1].getAttribute("aria-pressed") !== "true") return "the wrong choice is marked on";

  });
  t("Occasional controls stay folded away until asked for", function(){
    const id = "probe_disclosure";
    const was = state.ui.open[id];
    state.ui.open[id] = false;
    let built = 0;
    const shut = disclosure(id, "Probe", function(){ built++; return h("div", {text:"body"}); });

    if (built !== 0) return "a closed disclosure built its contents for nothing";
    if (shut.querySelector(".disclosure-toggle").getAttribute("aria-expanded") !== "false")
      return "a closed disclosure does not say it is closed";
    state.ui.open[id] = true;
    const open = disclosure(id, "Probe", function(){ built++; return h("div", {text:"body"}); });
    state.ui.open[id] = was;
    if (!open.querySelector(".disclosure-body")) return "an open disclosure drew nothing";
    return open.querySelector(".disclosure-toggle").getAttribute("aria-expanded") === "true"
      ? true : "an open disclosure does not say it is open";
  });
  t("The version marker in the file matches the version the app reports", function(){
    /* This is the marker you read off a deployed page to know what is actually
       live. It was wrong for four releases because it was kept by hand. */
    let marker = null;
    for (const node of document.childNodes)
      if (node.nodeType === 8 && node.nodeValue.indexOf("Garden Planner ::") >= 0) marker = node.nodeValue;
    if (!marker) return "no version marker comment in the file";
    const m = marker.match(/v([0-9]+\.[0-9]+\.[0-9]+)/);
    if (!m) return "the marker carries no version: " + marker.trim();
    if (m[1] !== APP.version) return "the marker says " + m[1] + " and the app says " + APP.version;

  t("A spreading plant holds its squares without deleting them", function(){

    addPlanting(bed, 0, "squash");
    const cells = bedCellsAt(bed, 200);

    const held = cells.filter(function(c){ return c && !c.anchor; }).length;
    const anchors = cells.filter(function(c){ return c && c.anchor; }).length;
    if (anchors !== 1) return anchors + " squares claim to be the plant itself";
    if (held !== 3) return held + " squares are held rather than 3";
    if (cells.filter(Boolean).length !== 4) return "the footprint is not four squares";
    return true;
  });
  t("The whole season view shows the first crop and counts what follows", function(){
    const bed = {id:"probe", name:"Probe", cols:1, rows:1, kind:"bed", plantings:[]};
    addPlanting(bed, 0, "radish");
    const first = bed.plantings[0];
    const next = successors(bed, 0, first.e + 1)[0];
    if (!next) return true;
    addPlanting(bed, 0, next.plant.id, next.start);
    const whole = bedCellsAt(bed, null)[0];
    if (whole.p !== "radish") return "the season view shows " + whole.p + " rather than the first crop";
    if (whole.more !== 1) return "it counted " + whole.more + " follow on crops rather than 1";
    const early = bedCellsAt(bed, first.s + 1)[0];
    const late = bedCellsAt(bed, next.start + 1)[0];
    return (early.p === "radish" && late.p === next.plant.id) ? true : "the day view lost track of the sequence";
  });
  t("Across a season, only crops that overlap are in each other's way", function(){
    const bed = {id:"probe", name:"Probe", cols:2, rows:1, kind:"bed", plantings:[
      {id:"a", p:"tomato", i:0, s:130, e:300, a:{}},
      {id:"b", p:"pepper", i:1, s:20, e:100, a:{}}
    ]};
    if (bedConflicts(bed, null).near.length) return "two crops that never meet were flagged";

    reconcilePlot();
    const ok = state.plot.slots.indexOf("probe_bed") >= 0;
    state.beds = state.beds.filter(function(b){ return b.id !== "probe_bed"; });
    state.plot = before;
    return ok ? true : "reconcile left it stranded";
  });
  t("Layouts keep their own beds", function(){
    const held = state.activeId;
    const a = activeLayout();
    const b = duplicateLayout(a.id, "Test copy");
    b.beds[0].plantings.push({id:"z", p:"radish", i:0, s:1, e:20, a:{}});
    const leaked = a.beds[0].plantings.some(function(pl){ return pl.id === "z"; });
    state.layouts = state.layouts.filter(function(l){ return l.id !== b.id; });
    state.activeId = held;
    return leaked ? "editing the copy changed the original" : true;
  });
  t("The plot holds exactly rows by columns slots", function(){
    return state.plot.slots.length === state.plot.rows * state.plot.cols
      ? true : state.plot.slots.length + " slots for " + state.plot.rows + " by " + state.plot.cols;
  });
  t("Every bed is seated in the plot exactly once", function(){
    const seen = {};
    for (const id of state.plot.slots){
      if (!id) continue;
      if (seen[id]) return id + " is in two slots";
      if (!bedById(id)) return "slot points at missing bed " + id;
      seen[id] = 1;
    }
    for (const b of state.beds) if (inPlot(b) && !seen[b.id]) return b.name + " is stranded outside the plot";
    return true;
  });
  t("A file saved before the plot existed still loads", function(){
    const legacy = {app:"garden-planner", schema:2, beds:[
      {id:"bed-east", name:"East", cols:4, rows:8, cells:["tomato"]},
      {id:"bed-west", name:"West", cols:4, rows:8, cells:["corn"]},
      {id:"border", name:"Perimeter border", kind:"border", cols:12, rows:1, cells:["sunflower"]}
    ], containers:[]};
    const res = validate(legacy);
    if (!res.ok) return res.errs.join(", ");
    const plot = res.value.layouts[0].plot;
    if (!plot) return "no plot was rebuilt";
    if (plot.slots.indexOf("bed-east") < 0 || plot.slots.indexOf("bed-west") < 0) return "the beds were not seated";
    if (plot.slots.indexOf("border") >= 0) return "the border was put in the plot";
    return true;
  });
  t("Every zone has sane frost dates", function(){
    for (const z of ZONES){
      if (!z.last){ if (z.first) return z.id + " is half frost free"; continue; }
      if (doy(z.first) - doy(z.last) < 60) return z.id + " has an impossibly short season";
    }
    for (let i = 1; i < ZONES.length; i++){
      const a = ZONES[i - 1], b = ZONES[i];
      if (a.last && b.last && doy(b.last) > doy(a.last)) return b.id + " thaws later than " + a.id;
    }
    return true;
  });
  t("Zone 7a projects back to the reference timing unchanged", function(){
    const held = JSON.parse(JSON.stringify(state.farm));
    setZone("7a");
    let worst = 0;
    PLANT_LIBRARY.forEach(function(p){
      ["indoor", "transplant", "direct", "harvest"].forEach(function(k){
        const raw = parseSpan(p.zone7a[k]), got = projectedSpans(p, k);
        if (raw.length !== got.length) worst = 99;
        raw.forEach(function(sp, i){
          if (got[i]) worst = Math.max(worst, Math.abs(sp.s - got[i].s) * 365, Math.abs(sp.e - got[i].e) * 365);
        });
      });
    });
    state.farm = held;
    return worst < 1 ? true : "drifted by " + worst.toFixed(1) + " days";
  });
  t("A colder zone pushes spring work later and autumn work earlier", function(){
    const held = JSON.parse(JSON.stringify(state.farm));
    setZone("7a");
    const tom = PLANT_MAP.tomato;
    const warmOut = projectedSpans(tom, "transplant")[0].startDay;
    const warmEnd = projectedSpans(tom, "harvest")[0].endDay;
    setZone("4b");
    const coldOut = projectedSpans(tom, "transplant")[0].startDay;
    const coldEnd = projectedSpans(tom, "harvest")[0].endDay;
    state.farm = held;
    if (!(coldOut > warmOut + 20)) return "transplant moved " + (coldOut - warmOut) + " days";
    if (!(coldEnd < warmEnd - 20)) return "harvest end moved " + (coldEnd - warmEnd) + " days";
    return true;
  });
  t("Autumn sowing follows the first frost, not the last", function(){
    const held = JSON.parse(JSON.stringify(state.farm));
    setZone("7a");
    const warm = projectedSpans(PLANT_MAP.garlic, "direct")[0].startDay;
    setZone("4b");
    const cold = projectedSpans(PLANT_MAP.garlic, "direct")[0].startDay;
    state.farm = held;
    return cold < warm - 20 ? true : "garlic sowing moved " + (cold - warm) + " days";
  });
  t("A short season is flagged rather than quietly drawn", function(){
    const held = JSON.parse(JSON.stringify(state.farm));
    setZone("3a");
    const flagged = PLANT_LIBRARY.filter(function(p){ return seasonNote(p); }).length;
    setZone("7a");
    const easy = PLANT_LIBRARY.filter(function(p){ return seasonNote(p); }).length;
    state.farm = held;
    if (easy !== 0) return easy + " plants flagged in the reference zone";
    return flagged > 0 ? true : "nothing flagged in zone 3a";
  });
  t("Custom frost dates are kept and refused when backwards", function(){
    const held = JSON.parse(JSON.stringify(state.farm));
    const res = validate({app:"garden-planner", farm:{zone:"6b", custom:true, lastFrost:[3,20], firstFrost:[9,10]},
                          layouts:[{id:"l1", name:"A", beds:[]}]});
    const back = validate({app:"garden-planner", farm:{zone:"6b", custom:true, lastFrost:[9,1], firstFrost:[3,1]},
                           layouts:[{id:"l1", name:"A", beds:[]}]});
    state.farm = held;
    if (!res.ok || res.value.farm.lastFrost[1] !== 20) return "good custom dates were lost";
    if (back.value.farm.custom) return "a backwards pair was accepted";
    return true;
  });
  t("The farm always keeps one open layout", function(){
    const before = liveLayouts().length;
    archiveLayout(state.activeId, true);
    const after = liveLayouts().length;
    return (before === 1 && after === 1) || after >= 1 ? true : "archived the last layout";
  });
  t("A file from before layouts existed becomes one layout", function(){
    const legacy = {app:"garden-planner", schema:3,
      beds:[{id:"bed-east", name:"East", cols:4, rows:8, cells:["tomato"]}],
      plot:{rows:1, cols:1, slots:["bed-east"]}, containers:[{id:"c1", name:"Pot", plant:"basil"}]};
    const res = validate(legacy);
    if (!res.ok) return res.errs.join(", ");
    if (res.value.layouts.length !== 1) return res.value.layouts.length + " layouts";
    const l = res.value.layouts[0];
    if (l.beds[0].plantings[0].p !== "tomato") return "the bed was lost in migration";
    if (!l.containers[0].plantings.length || l.containers[0].plantings[0].p !== "basil") return "the pot was lost in migration";
    if (res.value.farm.zone !== "7a") return "the zone did not default";
    return true;
  });
  t("Month ranges parse", function(){
    const a = parseSpan("Feb-Mar");
    if (a.length !== 1 || Math.abs(a[0].s - 1 / 12) > 1e-9 || Math.abs(a[0].e - 3 / 12) > 1e-9) return "Feb-Mar wrong";
    const b = parseSpan("May");
    if (b.length !== 1 || Math.abs(b[0].e - b[0].s - 1 / 12) > 1e-9) return "single month wrong";
    return true;
  });
  t("Year-round fills the track", function(){
    const a = parseSpan("Year-round");
    return (a.length === 1 && a[0].s === 0 && a[0].e === 1) ? true : "got " + JSON.stringify(a);
  });
  t("A range that crosses the new year becomes two spans", function(){
    const a = parseSpan("Oct-Jun");
    return (a.length === 2 && a[0].e === 1 && a[1].s === 0) ? true : "got " + JSON.stringify(a);
  });
  t("Junk files are refused", function(){
    if (validate(null).ok) return "null was accepted";
    if (validate("not a layout").ok) return "a string was accepted";
    if (validate({app:"something-else", beds:[]}).ok) return "a foreign file was accepted";
    return true;
  });
  t("Text from a file is rendered as text, never markup", function(){
    const el = h("div", {text:"<img src=x onerror=alert(1)>"});
    return el.querySelector("img") === null && el.textContent.indexOf("<img") === 0
      ? true : "markup survived: " + el.innerHTML;
  });
  t("The written plan only names plants that exist", function(){
    const bad = [];
    Object.keys(PLAN).forEach(function(bedId){
      const p = PLAN[bedId];
      [].concat(p.fill || [], p.lastRow || [], p.rowCycle || [], p.cycle || [], (p.rows || []).flat())
        .forEach(function(id){ if (id && !PLANT_MAP[id]) bad.push(bedId + " to " + id); });
    });
    return bad.length ? bad.join(", ") : true;
  });
  t("Theme tokens are defined", function(){
    const v = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    return v ? true : "no background token for theme " + state.ui.theme;
  });
  state.ui.testResults = r;
  return r;
}

/* ---------- shell --------------------------------------------------------- */
/* Seven places, each with one job. Containers moved into the plan, because a pot
   is part of the layout you are arranging. The two derived lists live together
   under Do, and the three year long views under Season. */
const TABS = [["planner","Plan"],["do","Do"],["calendar","Season"],["journal","Record"],
              ["library","Plants"],["farm","Farm"],["about","About"]];
const THEMES = [["garden","Garden"],["night","Night"],["contrast","High contrast"]];

function buildShell(){
  const nav = qs(".tabs");
  clear(nav);
  TABS.forEach(function(t){
    add(nav, h("button", {class:"tab-btn", type:"button", role:"tab", id:"tab-" + t[0],
      "aria-controls":"panel-" + t[0], "aria-selected":state.ui.tab === t[0], text:t[1],
      onclick:function(){ state.ui.tab = t[0]; persist(); render(); }}));
  });
  const main = qs("#main");
  clear(main);
  TABS.forEach(function(t){
    add(main, h("section", {id:"panel-" + t[0], role:"tabpanel", "aria-labelledby":"tab-" + t[0],
      class:state.ui.tab === t[0] ? "" : "hidden", tabindex:"-1"}));
  });
  add(main, h("p", {class:"lede", style:{marginTop:"28px", textAlign:"center"},
    text:APP.name + " v" + APP.version + " \u00b7 GPL-3.0 \u00b7 runs offline from disk"}));
}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", state.ui.theme);
  const label = THEMES.filter(function(t){ return t[0] === state.ui.theme; })[0];
  qs("#btn-theme").textContent = "Theme: " + (label ? label[1] : "Garden");
}
function render(){
  reindex();
  reconcilePlot();
  const sub = qs(".brand .sub");
  if (sub) sub.textContent = state.farm.name + " \u00b7 Zone " + state.farm.zone +
    (frostFree() ? ", frost free" : (", frost " + fmtDate(farmFrost().last) + " to " + fmtDate(farmFrost().first))) +
    " \u00b7 square foot method";
  applyTheme();
  buildShell();
  if (state.ui.tab === "planner") renderPlanner();
  else if (state.ui.tab === "calendar") renderCalendar();

  else if (state.ui.tab === "library") renderLibrary();
  else if (state.ui.tab === "do") renderDo();
  else if (state.ui.tab === "journal") renderJournal();
  else if (state.ui.tab === "farm") renderFarm();
  else renderAbout();
  log("rendered", state.ui.tab);
}

function boot(){
  const saved = store.get(STORE_KEY);
  if (saved){
    try {
      const data = JSON.parse(saved);
      const res = validate(data);
      if (res.ok) adopt(res.value);
      if (data.ui){
        if (THEMES.some(function(t){ return t[0] === data.ui.theme; })) state.ui.theme = data.ui.theme;
        state.ui.debug = !!data.ui.debug;
        state.ui.emojiMarks = !!data.ui.emojiMarks;
        if ([7, 14, 30].indexOf(Number(data.ui.horizon)) >= 0) state.ui.horizon = Number(data.ui.horizon);
        if (["timing", "beds", "load"].indexOf(data.ui.calView) >= 0) state.ui.calView = data.ui.calView;
      }
    } catch (e) { /* a broken working copy is not worth stopping for */ }
  }
  qs("#btn-theme").addEventListener("click", function(){
    const i = THEMES.findIndex(function(t){ return t[0] === state.ui.theme; });
    state.ui.theme = THEMES[(i + 1) % THEMES.length][0];
    persist(); applyTheme(); toast("Theme: " + THEMES[(i + 1) % THEMES.length][1]);
  });
  qs("#btn-save").addEventListener("click", function(){
    if (canSaveBack()) saveBack(); else saveFile();
  });
  if (canSaveBack()) qs("#btn-save").title = "Writes back to the same file after the first save";
  qs("#btn-load").addEventListener("click", function(){ qs("#file-load").click(); });
  qs("#file-load").addEventListener("change", function(e){
    const f = e.target.files && e.target.files[0];
    if (f) loadFile(f);
    e.target.value = "";
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){
      if (state.ui.selected){ state.ui.selected = null; renderPlanner(); hideTip(); }
      else if (state.ui.inspect){ state.ui.inspect = null; renderPlanner(); }
    }
    if ((e.key === "z" || e.key === "Z") && (e.ctrlKey || e.metaKey)){
      e.preventDefault();
      if (e.shiftKey) redo(); else undo();
    }
    if (e.key === "y" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); redo(); }
    if (e.key === "s" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); saveFile(); }
    if (state.ui.tab === "planner" && (e.key === "[" || e.key === "]")){
      const step = e.shiftKey ? 7 : 1;
      state.ui.day = Math.max(1, Math.min(365, state.ui.day + (e.key === "]" ? step : -step)));
      renderPlanner();
    }
  });
  document.addEventListener("pointerup", function(){
    const pn = state.ui.painting;
    state.ui.painting = false;
    if (pn && pn.changed){ persist(); render(); }
  });
  installPwaLayer();
  window.addEventListener("scroll", hideTip, {passive:true});
  render();
  log("booted", APP.version);
}
/* ---------- install layer --------------------------------------------------
   A web app manifest can be handed over as a blob, so adding this to a phone
   home screen works when the file is served. A service worker cannot: browsers
   refuse to register one from a blob or from file://, and the hard rule is that
   this app runs from disk. So there is no offline cache layer and there does not
   need to be, since the whole app is the one file you already have.            */
function installPwaLayer(){
  try {
    const icon = "data:image/svg+xml," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">' +
      '<rect width="512" height="512" rx="72" fill="#2d4a2d"/>' +
      '<g fill="none" stroke="#f4f0e8" stroke-width="14">' +
      '<rect x="96" y="96" width="130" height="130" rx="10"/>' +
      '<rect x="286" y="96" width="130" height="130" rx="10"/>' +
